
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="涵予宝宝">
<meta name="theme-color" content="#FFB5BA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>涵予宝宝育儿工作台</title>
<style>
/* ==================== 全局变量与重置 ==================== */
:root{
  --c-pink:#FFB5BA;--c-pink-light:#FFE4E6;--c-pink-deep:#F472A6;
  --c-blue:#B5D8F7;--c-blue-light:#E0F2FE;--c-blue-deep:#60A5FA;
  --c-yellow:#FFE5B4;--c-yellow-light:#FEF3C7;--c-yellow-deep:#FBBF24;
  --c-green:#C8E6C9;--c-green-light:#F0FDF4;--c-green-deep:#34D399;
  --c-purple:#E1BEE7;--c-purple-light:#F3E8FF;--c-purple-deep:#A78BFA;
  --c-orange:#FFCC80;--c-orange-light:#FFF3E0;--c-orange-deep:#FB923C;
  --c-teal:#B2DFDB;--c-teal-light:#E0F2F1;--c-teal-deep:#4DB6AC;
  --c-rose:#FFCDD2;--c-rose-light:#FEE2E2;--c-rose-deep:#FB7185;
  --c-indigo:#C5CAE9;--c-indigo-light:#E8EAF6;--c-indigo-deep:#818CF8;
  --bg-main:#FFF9F5;--bg-card:#FFFFFF;--text-main:#3D2E2A;--text-sub:#8B7B78;
  --shadow:0 2px 12px rgba(0,0,0,0.06);--shadow-lg:0 4px 20px rgba(0,0,0,0.1);
  --radius:14px;--radius-sm:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:var(--bg-main);color:var(--text-main);line-height:1.6;min-height:100vh;overflow-x:hidden}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{border:1.5px solid #E8E0DC;border-radius:var(--radius-sm);padding:8px 10px;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--c-pink-deep);box-shadow:0 0 0 3px rgba(244,114,166,0.1)}
input[type=checkbox],input[type=radio]{width:auto;padding:0;border:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#D8C8C4;border-radius:3px}

/* ==================== 顶部固定栏 ==================== */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(135deg,#FFD1DC 0%,#FFE4E6 100%);box-shadow:0 2px 10px rgba(244,114,166,0.15);display:flex;align-items:center;padding:10px 14px;gap:12px;min-height:56px;padding-top:calc(10px + env(safe-area-inset-top));min-height:calc(56px + env(safe-area-inset-top))}
.topbar .menu-btn{font-size:24px;flex-shrink:0;padding:4px 6px;border-radius:8px;transition:background .2s}
.topbar .menu-btn:active{background:rgba(255,255,255,0.5)}
.topbar .baby-avatar{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
.topbar .baby-info{flex:1;min-width:0}
.topbar .baby-name{font-size:15px;font-weight:700;color:#C42B5A;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .baby-meta{font-size:11px;color:#D4647A;display:flex;gap:8px;flex-wrap:wrap}
.topbar .baby-meta b{font-weight:600}
.topbar .family-tag{font-size:11px;background:rgba(255,255,255,0.7);padding:3px 8px;border-radius:12px;color:#C42B5A;white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis}

/* ==================== 左侧导航抽屉 ==================== */
.nav-mask{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:200;opacity:0;visibility:hidden;transition:.3s}
.nav-mask.open{opacity:1;visibility:visible}
.nav-drawer{position:fixed;top:0;left:0;bottom:0;width:230px;background:#fff;z-index:201;transform:translateX(-100%);transition:transform .3s ease;display:flex;flex-direction:column;box-shadow:2px 0 16px rgba(0,0,0,0.1);padding-top:env(safe-area-inset-top)}
.nav-drawer.open{transform:translateX(0)}
.nav-header{padding:18px 16px 14px;background:linear-gradient(135deg,#FFD1DC,#FFE4E6);text-align:center}
.nav-header .avatar{width:54px;height:54px;border-radius:50%;background:#fff;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.nav-header .name{font-size:16px;font-weight:700;color:#C42B5A}
.nav-header .sub{font-size:11px;color:#D4647A;margin-top:2px}
.nav-list{flex:1;overflow-y:auto;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:14px;color:var(--text-main);transition:all .2s;border-left:3px solid transparent}
.nav-item:active{background:var(--c-pink-light)}
.nav-item.active{background:var(--c-pink-light);border-left-color:var(--c-pink-deep);font-weight:600}
.nav-item .icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.nav-item.active .icon{transform:scale(1.15)}
.nav-footer{padding:12px 16px;border-top:1px solid #F0E8E4;font-size:11px;color:var(--text-sub);text-align:center}

/* ==================== 主内容区 ==================== */
.main{padding:66px 0 70px;padding-top:calc(66px + env(safe-area-inset-top));padding-bottom:calc(70px + env(safe-area-inset-bottom));min-height:100vh}
.page{display:none;padding:12px}
.page.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.sub-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:sticky;top:56px;z-index:50;background:var(--bg-main);padding:8px 0}
.back-btn{font-size:20px;padding:4px 8px;border-radius:8px;background:#fff;box-shadow:var(--shadow);flex-shrink:0}
.page-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}

/* ==================== 卡片 ==================== */
.card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;justify-content:space-between}
.card-title .left{display:flex;align-items:center;gap:6px}
.card-title .left .icon{font-size:16px}

.hero-card{background:linear-gradient(135deg,#FFD1DC 0%,#FFC1CC 100%);border-radius:var(--radius);padding:16px;color:#fff;margin-bottom:12px;box-shadow:0 4px 14px rgba(244,114,166,0.2)}
.hero-card .top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hero-card .baby-row{display:flex;align-items:center;gap:10px}
.hero-card .baby-row .avatar{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:26px}
.hero-card .baby-row .info h2{font-size:18px;font-weight:700}
.hero-card .baby-row .info p{font-size:11px;opacity:0.9}
.hero-card .stats{display:flex;gap:8px}
.hero-card .stat-box{background:rgba(255,255,255,0.25);border-radius:10px;padding:8px 12px;text-align:center;flex:1}
.hero-card .stat-box .num{font-size:20px;font-weight:700;line-height:1.2}
.hero-card .stat-box .label{font-size:10px;opacity:0.9}

.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick-item{background:#fff;border-radius:var(--radius-sm);padding:10px 4px;text-align:center;box-shadow:var(--shadow);transition:transform .15s}
.quick-item:active{transform:scale(0.94)}
.quick-item .icon{font-size:22px;display:block;margin-bottom:3px}
.quick-item .label{font-size:10px;color:var(--text-sub);line-height:1.2}

.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.check-item{border-radius:var(--radius-sm);padding:10px 6px;text-align:center;border:1.5px solid;transition:all .2s}
.check-item.done{filter:brightness(0.97)}
.check-item .ci-icon{font-size:20px;display:block;margin-bottom:3px}
.check-item .ci-label{font-size:11px;font-weight:600}
.check-item .ci-status{font-size:9px;margin-top:2px;opacity:0.7}

.mod-pink{background:var(--c-pink-light);border-color:var(--c-pink)}.mod-pink .ci-icon{color:var(--c-pink-deep)}
.mod-blue{background:var(--c-blue-light);border-color:var(--c-blue)}.mod-blue .ci-icon{color:var(--c-blue-deep)}
.mod-green{background:var(--c-green-light);border-color:var(--c-green)}.mod-green .ci-icon{color:var(--c-green-deep)}
.mod-yellow{background:var(--c-yellow-light);border-color:var(--c-yellow)}.mod-yellow .ci-icon{color:var(--c-yellow-deep)}
.mod-purple{background:var(--c-purple-light);border-color:var(--c-purple)}.mod-purple .ci-icon{color:var(--c-purple-deep)}
.mod-orange{background:var(--c-orange-light);border-color:var(--c-orange)}.mod-orange .ci-icon{color:var(--c-orange-deep)}
.mod-teal{background:var(--c-teal-light);border-color:var(--c-teal)}.mod-teal .ci-icon{color:var(--c-teal-deep)}
.mod-rose{background:var(--c-rose-light);border-color:var(--c-rose)}.mod-rose .ci-icon{color:var(--c-rose-deep)}
.mod-indigo{background:var(--c-indigo-light);border-color:var(--c-indigo)}.mod-indigo .ci-icon{color:var(--c-indigo-deep)}

.form-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.form-group{flex:1;min-width:120px}
.form-group label{display:block;font-size:12px;color:var(--text-sub);margin-bottom:4px;font-weight:600}
.form-group input,.form-group select,.form-group textarea{font-size:13px}
textarea{resize:vertical;min-height:60px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:all .15s;border:none}
.btn:active{transform:scale(0.96)}
.btn-primary{background:var(--c-pink-deep);color:#fff}
.btn-blue{background:var(--c-blue-deep);color:#fff}
.btn-green{background:var(--c-green-deep);color:#fff}
.btn-orange{background:var(--c-orange-deep);color:#fff}
.btn-purple{background:var(--c-purple-deep);color:#fff}
.btn-teal{background:var(--c-teal-deep,#0D9488);color:#fff}
.btn-rose{background:var(--c-rose-deep);color:#fff}
.btn-ghost{background:#F5EDE9;color:var(--text-main)}
.btn-danger{background:#FECACA;color:#DC2626}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-block{width:100%}
.btn-fab{position:fixed;bottom:18px;right:18px;width:50px;height:50px;border-radius:50%;background:var(--c-pink-deep);color:#fff;font-size:26px;box-shadow:0 4px 14px rgba(244,114,166,0.4);z-index:90;display:flex;align-items:center;justify-content:center;line-height:1}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#F8F0EC;padding:8px 6px;text-align:left;font-weight:600;color:var(--text-sub);white-space:nowrap;position:sticky;top:0}
td{padding:7px 6px;border-bottom:1px solid #F0E8E4;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:active{background:#F8F0EC}

.record-item{background:#FAF5F2;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.record-item .ri-main{flex:1;min-width:0}
.record-item .ri-time{font-size:11px;color:var(--text-sub)}
.record-item .ri-content{font-size:13px;font-weight:500}
.record-item .ri-tag{font-size:10px;padding:2px 6px;border-radius:8px;background:var(--c-pink-light);color:var(--c-pink-deep);white-space:nowrap}
.record-item .ri-del{font-size:18px;color:#E0A0A0;padding:4px;flex-shrink:0}
.record-item .ri-del:active{color:#DC2626}

.filter-bar{display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.filter-bar input,.filter-bar select{width:auto;min-width:100px;font-size:12px;padding:6px 8px}

.chart-wrap{overflow-x:auto;padding:4px 0}
.chart-wrap svg{display:block;margin:0 auto;min-width:280px}
.chart-legend{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:11px;flex-wrap:wrap}
.chart-legend span{display:flex;align-items:center;gap:4px}
.chart-legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

.empty{text-align:center;padding:30px 16px;color:var(--text-sub);font-size:13px}
.empty .icon{font-size:36px;display:block;margin-bottom:6px;opacity:0.4}

.tip{font-size:11px;color:var(--text-sub);background:#F8F0EC;border-radius:8px;padding:6px 10px;margin-top:6px}
.tip.warn{background:#FEF3C7;color:#92400E}
.tip.info{background:var(--c-blue-light);color:#1E40AF}

.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600}
.badge-free{background:var(--c-green-light);color:#16A34A}
.badge-paid{background:var(--c-orange-light);color:#C2410C}
.badge-done{background:#D1FAE5;color:#059669}
.badge-pending{background:#FEF3C7;color:#D97706}
.badge-soon{background:#FECACA;color:#DC2626}

.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--c-pink-light)}
.timeline-item{position:relative;margin-bottom:14px}
.timeline-item::before{content:'';position:absolute;left:-18px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--c-pink-deep);border:2px solid #fff;box-shadow:0 0 0 2px var(--c-pink-light)}

.tabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.tab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;background:#F5EDE9;color:var(--text-sub);flex-shrink:0}
.tab.active{background:var(--c-pink-deep);color:#fff}

.summary-bar{background:linear-gradient(135deg,var(--c-pink-light),#FFF0F3);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-around;text-align:center}
.summary-bar .sb-item .num{font-size:18px;font-weight:700;color:var(--c-pink-deep)}
.summary-bar .sb-item .label{font-size:10px;color:var(--text-sub)}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;display:none;align-items:flex-end;justify-content:center}
.modal-mask.open{display:flex;animation:fadeIn .2s}
.modal{background:#fff;width:100%;max-width:500px;border-radius:18px 18px 0 0;padding:16px;max-height:88vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-header h3{font-size:16px;font-weight:700}
.modal-close{font-size:22px;color:var(--text-sub);padding:2px 8px}

.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:400;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}

/* ====== 网络状态横幅 ====== */
.net-banner{position:fixed;bottom:0;left:0;right:0;z-index:90;background:#FEF3C7;color:#92400E;padding:8px 14px;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;transform:translateY(100%);transition:transform .3s ease;padding-bottom:calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px rgba(0,0,0,0.08)}
.net-banner.show{transform:translateY(0)}
.net-banner .nb-text{flex:1;display:flex;align-items:center;gap:6px}
.net-banner .nb-btn{background:#FBBF24;color:#fff;padding:4px 12px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0}

.member-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.member-chip{padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600;background:#F5EDE9;color:var(--text-sub);flex-shrink:0}
.member-chip.active{background:var(--c-pink-deep);color:#fff}

.progress{height:6px;background:#F0E8E4;border-radius:3px;overflow:hidden;margin:4px 0}
.progress-bar{height:100%;border-radius:3px;transition:width .4s}

@media(min-width:768px){
  .main{padding:66px 16px 70px;margin-left:0}
  .nav-drawer{transform:translateX(0);box-shadow:none;position:sticky}
  .nav-mask{display:none!important}
  .menu-btn{display:none}
  .main-wrap{max-width:600px;margin:0 auto}
}

.quick-action-row{display:flex;gap:10px}
.quick-action-btn{flex:1;border-radius:var(--radius-sm);padding:12px 8px;text-align:center;font-weight:700;font-size:13px;box-shadow:var(--shadow);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;border:none}
.quick-action-btn:active{transform:scale(0.95)}
.qa-feed{background:linear-gradient(135deg,#E0F2FE,#B5D8F7);color:#1E40AF}
.qa-poop{background:linear-gradient(135deg,#F0FDF4,#C8E6C9);color:#166534}

.ana-panel{font-size:13px}
.ana-item{padding:7px 10px;border-radius:8px;margin-bottom:6px;line-height:1.5}
.ana-ok{background:#F0FDF4;color:#166534}
.ana-warn{background:#FEF3C7;color:#92400E}
.ana-info{background:var(--c-blue-light);color:#1E40AF}
</style>
</head>
<body>

<div id="loading" style="position:fixed;inset:0;background:#FFF9F5;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column">
  <div style="font-size:48px">👶</div>
  <div style="font-size:16px;color:#C42B5A;margin:12px 0;font-weight:700">涵予宝宝工作台</div>
  <div id="loadStatus" style="font-size:12px;color:#999">加载中...</div>
  <div id="loadDebug" style="font-size:10px;color:#ccc;margin-top:20px;padding:10px;text-align:center;max-width:90%;word-break:break-all"></div>
  <button onclick="forceSkipLoading()" style="margin-top:15px;padding:8px 20px;background:#FFB5BA;border:none;border-radius:8px;color:#fff;font-weight:600;font-size:13px">跳过加载</button>
</div>

<div class="topbar">
  <button class="menu-btn" onclick="toggleNav(true)">☰</button>
  <div class="baby-avatar">👶</div>
  <div class="baby-info">
    <div class="baby-name">涵予宝宝 🎀</div>
    <div class="baby-meta" id="topMeta">--</div>
  </div>
  <div class="family-tag" id="familyTag" onclick="openFamilyModal()">未设置</div>
</div>

<div class="nav-mask" id="navMask" onclick="toggleNav(false)"></div>
<nav class="nav-drawer" id="navDrawer">
  <div class="nav-header">
    <div class="avatar">👶</div>
    <div class="name">涵予宝宝</div>
    <div class="sub" id="navSubInfo">男宝 · 2026-03-24</div>
  </div>
  <div class="nav-list" id="navList"></div>
  <div class="nav-footer">
    <div style="margin-bottom:8px" id="navSyncStatus">💕 全家共同记录</div>
    <div style="display:flex;gap:6px;margin-bottom:6px">
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="exportData()">📤 导出</button>
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="importData()">📥 导入</button>
    </div>
    <button class="btn btn-blue btn-sm btn-block" style="margin-bottom:6px" onclick="openCloudConfigModal()">☁️ 云端同步</button>
    <button class="btn btn-primary btn-sm btn-block" onclick="saveToPhone()">📱 保存到手机</button>
  </div>
</nav>

<div class="main"><div class="main-wrap" id="mainWrap"></div></div>

<button class="btn-fab" id="fabBtn" onclick="onFabClick()" style="display:none">+</button>

<div class="modal-mask" id="modalMask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<div class="net-banner" id="netBanner">
  <div class="nb-text"><span>📶</span><span id="netBannerText">网络已断开，当前查看本地数据</span></div>
  <button class="nb-btn" onclick="retryNetwork()">重试</button>
</div>

<script>
/* ====================================================
   涵予宝宝育儿工作台 - 主程序
   ==================================================== */

// 状态指示
function setStatus(txt){ var el=document.getElementById('loadStatus'); if(el)el.textContent=txt; }
function hideLoading(){ var el=document.getElementById('loading'); if(el){el.style.opacity='0';setTimeout(function(){el.remove();},300);} }

var DB = {
  _cache: {},
  _loaded: false,
  _idb: null,
  _idbReady: false,
  _saveQueue: [],
  
  init: function(cb){
    var self = this;
    if(!self._loaded){
      self._loadFromLocalStorage();
      self._loaded = true;
    }
    /* 检查localStorage是否为空（可能被Safari清除） */
    var hasLocalData = false;
    for(var k in self._cache){
      if(self._cache.hasOwnProperty(k)){
        hasLocalData = true; break;
      }
    }
    if(!hasLocalData){
      /* localStorage为空，尝试从IndexedDB恢复 */
      self._initIDB();
      /* 等IndexedDB就绪后恢复，最多等3秒 */
      var restoreTimer = setTimeout(function(){
        if(cb) cb();
      }, 3000);
      var checkIDB = setInterval(function(){
        if(self._idbReady){
          clearInterval(checkIDB);
          clearTimeout(restoreTimer);
          self.restoreFromIDB(function(ok, idbData){
            if(ok && idbData){
              var hasIDBData = false;
              for(var ik in idbData){
                if(idbData.hasOwnProperty(ik)){ hasIDBData = true; break; }
              }
              if(hasIDBData){
                console.log('[DB] 从IndexedDB恢复数据');
                self._cache = idbData;
              }
            }
            if(cb) cb();
          });
        }
      }, 100);
      return;
    }
    /* localStorage有数据，异步初始化IndexedDB备份 */
    self._initIDB();
    if(cb) cb();
  },
  
  _initIDB: function(){
    var self = this;
    try{
      if(!window.indexedDB) return;
      var req = indexedDB.open('hanyu_baby_db', 1);
      var timeout = setTimeout(function(){
        console.log('[DB] IndexedDB初始化超时, 仅用localStorage');
      }, 3000);
      req.onsuccess = function(e){
        clearTimeout(timeout);
        self._idb = e.target.result;
        self._idbReady = true;
        self._flushSaveQueue();
        console.log('[DB] IndexedDB备份就绪');
      };
      req.onerror = function(){
        clearTimeout(timeout);
        console.log('[DB] IndexedDB打开失败, 仅用localStorage');
      };
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if(!db.objectStoreNames.contains('kv')){
          db.createObjectStore('kv');
        }
      };
    }catch(e){
      console.log('[DB] IndexedDB初始化异常: ' + e.message);
    }
  },
  
  _idbSet: function(key, val){
    var self = this;
    if(!self._idbReady || !self._idb){
      self._saveQueue.push({key:key, val:val});
      return;
    }
    try{
      var tx = self._idb.transaction(['kv'], 'readwrite');
      tx.objectStore('kv').put(JSON.stringify(val), key);
    }catch(e){}
  },
  
  _flushSaveQueue: function(){
    var self = this;
    while(self._saveQueue.length){
      var item = self._saveQueue.shift();
      self._idbSet(item.key, item.val);
    }
  },
  
  restoreFromIDB: function(cb){
    var self = this;
    if(!self._idbReady || !self._idb){ if(cb) cb(false); return; }
    try{
      var tx = self._idb.transaction(['kv'], 'readonly');
      var store = tx.objectStore('kv');
      var req = store.getAllKeys();
      req.onsuccess = function(){
        var keys = req.result;
        var pending = keys.length;
        if(pending === 0){ if(cb) cb(true, {}); return; }
        var result = {};
        keys.forEach(function(k){
          var getReq = store.get(k);
          getReq.onsuccess = function(){
            try{ result[k] = JSON.parse(getReq.result); }catch(e){}
            pending--;
            if(pending === 0){ if(cb) cb(true, result); }
          };
          getReq.onerror = function(){ pending--; if(pending===0){if(cb)cb(true,result);} };
        });
      };
      req.onerror = function(){ if(cb) cb(false); };
    }catch(e){ if(cb) cb(false); }
  },
  
  _loadFromLocalStorage: function(){
    for(var i=0; i<localStorage.length; i++){
      var fullKey = localStorage.key(i);
      if(fullKey && fullKey.indexOf(STORAGE_PREFIX) === 0){
        var shortKey = fullKey.substring(STORAGE_PREFIX.length);
        try{ this._cache[shortKey] = JSON.parse(localStorage.getItem(fullKey)); }catch(e){}
      }
    }
  },
  
  get: function(key, def){
    var v = this._cache[key];
    if(v === undefined){
      try{
        var raw = localStorage.getItem(STORAGE_PREFIX+key);
        if(raw){ v = JSON.parse(raw); this._cache[key] = v; }
      }catch(e){}
    }
    return v !== undefined ? v : def;
  },
  
  set: function(key, val){
    this._cache[key] = val;
    try{ localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(val)); }catch(e){}
    /* 异步写入IndexedDB备份 */
    this._idbSet(key, val);
    /* 触发云端同步（防抖） */
    if(typeof CloudSync !== 'undefined') CloudSync.onDataChange(key, val);
  },
  
  remove: function(key){
    delete this._cache[key];
    localStorage.removeItem(STORAGE_PREFIX+key);
    if(this._idbReady && this._idb){
      try{
        var tx = this._idb.transaction(['kv'], 'readwrite');
        tx.objectStore('kv').delete(key);
      }catch(e){}
    }
  },
  
  getAllData: function(){
    var result = {};
    for(var key in this._cache){
      if(this._cache.hasOwnProperty(key)) result[key] = this._cache[key];
    }
    for(var i=0; i<localStorage.length; i++){
      var fullKey = localStorage.key(i);
      if(fullKey && fullKey.indexOf(STORAGE_PREFIX) === 0){
        var shortKey = fullKey.substring(STORAGE_PREFIX.length);
        if(result[shortKey] === undefined){
          try{ result[shortKey] = JSON.parse(localStorage.getItem(fullKey)); }catch(e){}
        }
      }
    }
    return result;
  },
  
  replaceAllData: function(allData){
    var self = this;
    for(var key in allData){
      if(allData.hasOwnProperty(key)){
        self._cache[key] = allData[key];
        try{ localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(allData[key])); }catch(e){}
        self._idbSet(key, allData[key]);
      }
    }
  }
};

function calcDays(){
  var b = new Date(BABY.birth), n = new Date();
  return Math.floor((n-b)/(86400000))+1;
}
function calcAge(){
  var b = new Date(BABY.birth), n = new Date();
  var y = n.getFullYear()-b.getFullYear();
  var m = n.getMonth()-b.getMonth();
  var d = n.getDate()-b.getDate();
  if(d<0){ m--; d += new Date(n.getFullYear(),n.getMonth(),0).getDate(); }
  if(m<0){ y--; m+=12; }
  return {y:y,m:m,d:d,totalMonths:y*12+m};
}

/* 导出：把所有 localStorage 中 hanyu_ 开头的数据打包成 JSON 文件下载 */
function exportData(){
  try{
    var allData = DB.getAllData();
    var exportObj = {
      app: 'hanyu-baby-workbench',
      version: 2,
      exportTime: new Date().toISOString(),
      device: state.currentMember || '未知设备',
      data: allData
    };
    var jsonStr = JSON.stringify(exportObj, null, 2);
    var blob = new Blob([jsonStr], {type:'application/json'});
    var fileName = '涵予宝宝数据_' + fmtDate(new Date()) + '_' + fmtTime(new Date()).replace(/:/g,'') + '.json';

    /* iOS Safari 不支持 download 属性，用兼容方案 */
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);

    /* 如果下载没触发（部分手机），显示内容让用户手动保存 */
    setTimeout(function(){
      if(!document.hidden){
        toast('数据已导出！请到微信发送给家人');
      }
    }, 500);
  }catch(e){
    /* 降级方案：弹窗显示 JSON，让用户复制 */
    showExportFallback(jsonStr || '{}');
  }
}

/* 降级方案：在弹窗里显示文本，供手动复制 */

/* 导入：点击后弹出文件选择 / 粘贴两种方式 */
function importData(){
  var modal = $('#modalMask');
  $('#modalContent').innerHTML =

      '② 或复制文件内容，粘贴到下方文本框' +
    '</div>' +
    '<input type="file" id="importFile" accept=".json,application/json" style="margin-bottom:10px">' +
    '<div style="font-size:12px;color:var(--text-sub);margin-bottom:4px">或粘贴数据内容：</div>' +

      '<button class="btn btn-primary" style="flex:1" onclick="doImport()">合并导入</button>' +
    '</div>' +
    '<div class="tip info" style="margin-top:10px">💡 导入会<b>合并</b>数据，不会覆盖你已有的记录。相同时间的记录会去重。</div>';
  modal.classList.add('open');

/* 执行导入：支持文件和文本两种来源 */
function doImport(){
  var fileInput = document.getElementById('importFile');
  var textInput = document.getElementById('importText');
  var file = fileInput && fileInput.files[0];
  var text = textInput ? textInput.value.trim() : '';

  if(file){
    var reader = new FileReader();
    reader.onload = function(e){
      processImportData(e.target.result);
    };
    reader.onerror = function(){
      toast('文件读取失败');
    };
    reader.readAsText(file, 'UTF-8');
  }else if(text){
    processImportData(text);
  }else{
    toast('请选择文件或粘贴数据');
  }
}

/* 解析并合并导入的数据 */
function processImportData(rawText){
  try{
    var parsed = JSON.parse(rawText);
    var importData = parsed.data || parsed; /* 兼容直接是 data 对象的情况 */

    if(!importData || typeof importData !== 'object'){
      toast('数据格式不正确');
      return;
    }

    var mergedCount = 0;
    var newCount = 0;

    for(var key in importData){
      if(!importData.hasOwnProperty(key)) continue;
      var newVal = importData[key];
      var existVal = DB.get(key, null);

      if(existVal === null){
        /* 本地没有这个 key，直接写入 */
        DB.set(key, newVal);
        newCount++;
      }else if(Array.isArray(existVal) && Array.isArray(newVal)){
        /* 数组类型：合并去重（根据记录的 id 或 time 字段） */
        var merged = mergeArrays(existVal, newVal);
        DB.set(key, merged);
        mergedCount += (merged.length - existVal.length);
      }else if(existVal && typeof existVal === 'object' && newVal && typeof newVal === 'object' &&
               existVal.logs && newVal.logs){
        /* 带 logs 子字段的对象（如 health） */
        if(Array.isArray(existVal.logs) && Array.isArray(newVal.logs)){
          existVal.logs = mergeArrays(existVal.logs, newVal.logs);
        }
        if(Array.isArray(existVal.reactions) && Array.isArray(newVal.reactions)){
          existVal.reactions = mergeArrays(existVal.reactions, newVal.reactions);
        }
        /* 合并其他字段，新数据覆盖 */
        for(var k in newVal){
          if(!newVal.hasOwnProperty(k)) continue;
          if(k !== 'logs' && k !== 'reactions'){
            existVal[k] = newVal[k];
          }
        }
        DB.set(key, existVal);
        mergedCount++;
      }else{
        /* 其他类型：新数据覆盖旧数据（仅在值不同时） */
        if(JSON.stringify(existVal) !== JSON.stringify(newVal)){
          DB.set(key, newVal);
          mergedCount++;
        }
      }
    }

    closeModal();
    toast('导入成功！新增 ' + newCount + ' 项，合并 ' + mergedCount + ' 条记录');

    /* 刷新当前页面显示 */
    setTimeout(function(){
      renderModule(state.currentModule);
      refreshTopMeta();
    }, 500);
  }catch(e){
    toast('导入失败：' + (e.message || '数据格式错误'));
  }
}

/* 合并两个数组，按 id / time / date 字段去重 */
/* 带时间戳的数组合并：按记录ID去重，时间戳大的覆盖旧的 */
function mergeArraysWithTS(arr1, arr2){
  var map = {};
  var noId = [];
  /* 先放arr1 */
  for(var i=0; i<arr1.length; i++){
    var id = getRecordId(arr1[i]);
    if(id){
      map[id] = arr1[i];
    } else {
      noId.push(arr1[i]);
    }
  }
  /* 合并arr2 */
  for(var j=0; j<arr2.length; j++){
    var id2 = getRecordId(arr2[j]);
    if(id2){
      var existing = map[id2];
      if(existing){
        /* 比较时间戳，新的覆盖旧的 */
        var ts1 = String(existing._ts || existing.id || '0');
        var ts2 = String(arr2[j]._ts || arr2[j].id || '0');
        if(ts2 > ts1){
          map[id2] = arr2[j];
        }
      } else {
        map[id2] = arr2[j];
      }
    } else {
      noId.push(arr2[j]);
    }
  }
  /* 组装结果 */
  var result = [];
  for(var k in map){
    if(map.hasOwnProperty(k)) result.push(map[k]);
  }
  /* 添加无ID的记录 */
  for(var m=0; m<noId.length; m++){
    result.push(noId[m]);
  }
  /* 按时间排序 */
  if(result.length > 0 && (result[0].time || result[0].date)){
    result.sort(function(a,b){
      var ta = (a.date||'') + (a.time||'');
      var tb = (b.date||'') + (b.time||'');
      return ta < tb ? -1 : (ta > tb ? 1 : 0);
    });
  }
  return result;
}

/* 旧版mergeArrays保留向后兼容，内部调用新版本 */
function mergeArrays(oldArr, newArr){
  return mergeArraysWithTS(oldArr, newArr);
}

/* 生成记录唯一标识：优先用 id，其次 time+type，再次 date+type */
function getRecordId(rec){
  if(rec.id) return String(rec.id);
  if(rec.time && rec.type) return rec.time + '_' + rec.type;
  if(rec.date && rec.type) return rec.date + '_' + rec.type;
  if(rec.time) return rec.time;
  if(rec.date) return rec.date;
  return null;
}

/* ====================================================
   统一排序 + 详情弹窗系统
   ==================================================== */

/* 统一排序：按 date+time 倒序（最新在前） */
function sortRecordsDesc(records){
  return records.slice().sort(function(a, b){
    var ta = (a.date || '') + 'T' + (a.time || a.startTime || '00:00');
    var tb = (b.date || '') + 'T' + (b.time || b.startTime || '00:00');
    return tb.localeCompare(ta);
  });
}

/* 获取可见记录：过滤已删除 + 按日期筛选 + 倒序排序 */
function getVisibleRecords(key, filterDate){
  var records = DB.get(key, []);
  if(!Array.isArray(records)) return [];
  records = records.filter(function(r){ return !r._deletedAt; });
  if(filterDate) records = records.filter(function(r){ return r.date === filterDate; });
  return sortRecordsDesc(records);
}

  ensureTable: function(cb){

  /* 推送所有本地数据到云端（使用 Supabase 数据库表） */
  push: function(cb){

            if(cb) cb(false, '数据表未创建或未开放访问权限');
          } else {
            var errMsg = xhr.status + '';
            try{ var resp = JSON.parse(xhr.responseText); if(resp.message) errMsg = resp.message; }catch(e){}
            console.log('[CloudSync] push error: ' + xhr.status + ' ' + xhr.responseText);
            if(cb) cb(false, '上传失败(' + errMsg + ')');

          /* 如果同步期间有新数据变更，自动重推 */
          if(self._needRetry){
            self._needRetry = false;
            setTimeout(function(){ self.push(function(){}); }, 500);

      xhr.onerror = function(){
        self.syncing = false;
        if(cb) cb(false, '网络请求失败');
      };
      xhr.send(jsonStr);
    }catch(e){
      self.syncing = false;
      if(cb) cb(false, '请求异常');

  },
  
  /* 内部方法：只拉取云端原始数据，不合并到本地 */
  _rawPull: function(cb){
    var self = this;
    if(!self.config){ if(cb)cb(false); return; }
    try{
      var xhr = new XMLHttpRequest();
      var url = self.config.url + '/rest/v1/hanyu_data?family_code=eq.' + encodeURIComponent(self.config.familyCode) + '&order=updated_at.desc&limit=1';
      xhr.open('GET', url, true);
      xhr.setRequestHeader('apikey', self.config.anonKey);
      xhr.setRequestHeader('Authorization', 'Bearer ' + self.config.anonKey);
      xhr.onreadystatechange = function(){
        if(xhr.readyState === 4){
          if(xhr.status >= 200 && xhr.status < 300){
            try{
              var rows = JSON.parse(xhr.responseText);
              if(rows && rows.length > 0 && rows[0].data){
                if(cb) cb(true, rows[0].data);
              } else {
                if(cb) cb(true, null);
              }
            }catch(e){
              if(cb) cb(false, null);
            }
          } else {
            if(cb) cb(false, null);
          }
        }
      };

        if(cb) cb(false, null);
      };
      xhr.send();
    }catch(e){
      if(cb) cb(false, null);
    }
  },
  
  /* 从云端拉取数据（从数据库表读取） */
  pull: function(cb){
    var self = this;
    if(!self.enabled || !self.config){ if(cb)cb(false,'未配置'); return; }
    
    try{
      var xhr = new XMLHttpRequest();
      var url = self.config.url + '/rest/v1/hanyu_data?family_code=eq.' + encodeURIComponent(self.config.familyCode) + '&order=updated_at.desc&limit=1';
      xhr.open('GET', url, true);
      xhr.setRequestHeader('apikey', self.config.anonKey);
      xhr.setRequestHeader('Authorization', 'Bearer ' + self.config.anonKey);
      xhr.onreadystatechange = function(){
        if(xhr.readyState === 4){
          if(xhr.status >= 200 && xhr.status < 300){
            try{
              var rows = JSON.parse(xhr.responseText);
              if(rows && rows.length > 0 && rows[0].data){
                var cloudData = rows[0].data;
                var cloudTS = rows[0].updated_at;
                var localData = DB.getAllData();
                
                /* 安全检查：如果本地有数据但云端为空/数据更少，先push本地再merge */
                var localCount = countLocalData();
                var cloudCount = 0;
                var cKeys = ['feeding','daily','nursing','growth','vaccine','food','skills','health','memo','earlyedu'];
                for(var ci=0; ci<cKeys.length; ci++){
                  var cv = cloudData[cKeys[ci]];
                  if(Array.isArray(cv)) cloudCount += cv.length;
                  else if(cv && cv.logs) cloudCount += cv.logs.length;
                  else if(cv && cv.notes) cloudCount += cv.notes.length;
                  else if(cv && cv.purchase) cloudCount += cv.purchase.length;
                }
                console.log('[CloudSync] pull: 本地=' + localCount + '条, 云端=' + cloudCount + '条');
                
                /* 时间戳合并+删除标记（merge不会丢数据，取并集） */
                var merged = mergeCloudData(localData, cloudData);
                merged = cleanupDeletedRecords(merged);
                
                /* 二次安全检查：合并后数据量不应少于本地 */
                var mergedCount = 0;
                for(var mk in merged){
                  if(!merged.hasOwnProperty(mk)) continue;
                  var mv = merged[mk];
                  if(Array.isArray(mv)) mergedCount += mv.length;
                  else if(mv && mv.logs) mergedCount += mv.logs.length;
                }
                if(mergedCount < localCount && localCount > 0){
                  console.log('[CloudSync] 警告: 合并后数据量(' + mergedCount + ')少于本地(' + localCount + ')，跳过替换');
                  if(cb) cb(true, '本地数据较新，跳过同步');
                  /* 本地数据较新，直接push到云端 */
                  self.push(function(){});
                  return;
                }
                
                DB.replaceAllData(merged);
                DB.set('lastCloudPull', new Date().toISOString());
                /* 如果本地有更新且云端更旧，自动push */
                var localPushAt = DB.get('lastCloudPush', '1970-01-01T00:00:00Z');
                if(localPushAt > cloudTS){
                  self.push(function(){});
                }
                if(cb) cb(true, '拉取成功(' + Object.keys(cloudData).length + '项数据)');
              } else {
                console.log('[CloudSync] pull: rows=' + JSON.stringify(rows));
                if(cb) cb(true, '云端无数据(行数:' + (rows?rows.length:0) + ')');
              }
            }catch(e){
              if(cb) cb(false, '解析数据失败');
            }
          } else if(xhr.status === 404 || xhr.status === 0){
            if(cb) cb(false, '数据表未创建或未开放访问权限');
          } else {
            if(cb) cb(false, '拉取失败(' + xhr.status + ')');
          }
        }
      };
      xhr.onerror = function(){
        if(cb) cb(false, '网络请求失败');
      };
      xhr.send();
    }catch(e){
      if(cb) cb(false, '请求异常');
    }
  },
  
  /* 数据变化时防抖推送（缩短到1秒，减少丢数据风险） */
  onDataChange: function(key, val){
    var self = this;
    if(!self.enabled) return;
    /* 关键数据立即推送，不防抖 */
    var criticalKeys = ['feeding','daily','nursing','health','vaccine','earlyedu','growth','food','memo','skills'];
    var isCritical = false;
    for(var i=0; i<criticalKeys.length; i++){
      if(key === criticalKeys[i]){ isCritical = true; break; }
    }
    if(isCritical){
      /* 关键数据：1秒内推送 */
      clearTimeout(self.debounceTimer);
      self.debounceTimer = setTimeout(function(){
        self.push(function(ok){
          if(ok) console.log('[CloudSync] 自动同步成功');
          else console.log('[CloudSync] 自动同步失败，等待下次重试');
        });
      }, 1000);
    }
  },
  
  /* 手动同步 */
  manualSync: function(cb){
    var self = this;
    if(!self.enabled){ if(cb)cb(false,'未配置云端'); return; }
    /* 先推送本地数据到云端（覆盖旧数据），再拉取确认 */
    self.push(function(ok1, pushMsg){
      console.log('[CloudSync] push result: ' + ok1 + ' ' + pushMsg);
      self.pull(function(ok2, pullMsg){
        console.log('[CloudSync] pull result: ' + ok2 + ' ' + pullMsg);
        if(ok1){
          if(cb) cb(true, '同步成功');
        } else if(ok2){
          if(cb) cb(true, '拉取成功');
        } else {
          if(cb) cb(false, pushMsg || pullMsg || '同步失败');

  /* 紧急推送：页面即将卸载时调用，用同步 XHR 确保数据不丢 */
  emergencyPush: function(){
    var self = this;
    if(!self.enabled || !self.config) return;
    try{
      var allData = DB.getAllData();
      var dataCount = 0;
      for(var k in allData){ if(allData.hasOwnProperty(k)) dataCount++; }
      if(dataCount === 0) return;  /* 无数据不推送 */

      var payload = {
        family_code: self.config.familyCode,
        data: allData,
        device: (typeof state !== 'undefined' && state.currentMember) ? state.currentMember : 'unknown',
        updated_at: new Date().toISOString()
      };
      var jsonStr = JSON.stringify(payload);

      /* 同步 XHR 推送（页面卸载前阻塞发请求，确保请求发出）
         注意：sendBeacon 无法设置 apikey header，Supabase REST 需要鉴权，
         所以只能用同步 XHR */
      var xhr = new XMLHttpRequest();
      xhr.open('POST', self.config.url + '/rest/v1/hanyu_data', false);  /* false = 同步 */
      xhr.setRequestHeader('apikey', self.config.anonKey);
      xhr.setRequestHeader('Authorization', 'Bearer ' + self.config.anonKey);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.setRequestHeader('Prefer', 'resolution=merge-duplicates');
      xhr.send(jsonStr);
      console.log('[CloudSync] emergencyPush: status=' + xhr.status);
    }catch(e){
      console.log('[CloudSync] emergencyPush error: ' + e.message);
    }
  }
};

/* 合并云端数据和本地数据（时间戳合并+删除标记） */
function mergeCloudData(localData, cloudData){
  var merged = {};
  var allKeys = {};
  for(var k in localData){ if(localData.hasOwnProperty(k)) allKeys[k] = true; }
  for(var k2 in cloudData){ if(cloudData.hasOwnProperty(k2)) allKeys[k2] = true; }

  for(var key in allKeys){
    if(!allKeys.hasOwnProperty(key)) continue;
    var local = localData[key];
    var cloud = cloudData[key];

    if(local === undefined){
      /* 本地没有，云端有 */
      merged[key] = cloud;
    } else if(cloud === undefined){
      /* 云端没有，本地有 */
      merged[key] = local;
    } else if(Array.isArray(local) && Array.isArray(cloud)){
      /* 数组按ID合并，时间戳大的覆盖 */
      merged[key] = mergeArraysWithTS(local, cloud);
    } else if(local && typeof local === 'object' && cloud && typeof cloud === 'object'){
      /* 对象级合并 */
      merged[key] = mergeRecords(local, cloud);
    } else {
      /* 标量：本地优先 */
      merged[key] = local;
    }
  }
  /* 规范化：确保earlyedu是数组格式（兼容旧版对象格式） */
  if(merged.earlyedu && !Array.isArray(merged.earlyedu)){
    var oldObj = merged.earlyedu;
    var newArr = [];
    for(var ek in oldObj){
      if(oldObj.hasOwnProperty(ek) && oldObj[ek] && oldObj[ek].done){
        newArr.push({id:'migrated_'+ek+'_'+Date.now(),item:ek,date:oldObj[ek].date||todayStr(),time:'',note:'',member:oldObj[ek].member||'',_ts:String(Date.now())});
      }
    }
    merged.earlyedu = newArr;
  }
  return merged;
}
function mergeRecords(local, cloud){
  var result = {};
  for(var k in local){
    if(local.hasOwnProperty(k)) result[k] = local[k];
  }
  for(var k2 in cloud){
    if(!cloud.hasOwnProperty(k2)) continue;
    if(result[k2] === undefined){
      result[k2] = cloud[k2];
    } else if(Array.isArray(result[k2]) && Array.isArray(cloud[k2])){
      result[k2] = mergeArraysWithTS(result[k2], cloud[k2]);
    } else if(result[k2] && typeof result[k2] === 'object' && cloud[k2] && typeof cloud[k2] === 'object'){
      if(result[k2].logs && cloud[k2].logs){
        result[k2].logs = mergeArraysWithTS(result[k2].logs, cloud[k2].logs);
      }
      if(result[k2].reactions && cloud[k2].reactions){
        result[k2].reactions = mergeArraysWithTS(result[k2].reactions, cloud[k2].reactions);
      }
    }
  }
  return result;
}

/* 清理超过30天的已删除记录 */
function cleanupDeletedRecords(data){
  var now = Date.now();
  var cutoff = now - 30 * 24 * 60 * 60 * 1000;
  for(var key in data){
    if(!data.hasOwnProperty(key)) continue;
    if(Array.isArray(data[key])){
      data[key] = data[key].filter(function(r){
        if(r._deletedAt){
          var ts = new Date(r._deletedAt).getTime();
          if(ts < cutoff) return false;
        }
        return true;
      });
    } else if(data[key] && typeof data[key] === 'object'){
      if(data[key].logs){
        data[key].logs = data[key].logs.filter(function(r){
          if(r._deletedAt){
            var ts = new Date(r._deletedAt).getTime();
            if(ts < cutoff) return false;
          }
          return true;
        });
      }
      if(data[key].reactions){
        data[key].reactions = data[key].reactions.filter(function(r){
          if(r._deletedAt){
            var ts = new Date(r._deletedAt).getTime();
            if(ts < cutoff) return false;
          }
          return true;
        });
      }
    }
  }
  return data;
}

function debugCloudData(){
  var status = document.getElementById('cloudStatus');
  if(status) status.textContent = '查询云端数据中...';
  CloudSync._rawPull(function(ok, cloudData){
    var info = '';
    if(!ok){
      info = '❌ 无法连接云端';
    } else if(!cloudData){
      info = '⚠️ 云端无数据（数据可能被空数据覆盖了）';
    } else {
      var keys = [];
      for(var k in cloudData){ if(cloudData.hasOwnProperty(k)) keys.push(k); }
      info = '✅ 云端有 ' + keys.length + ' 项数据\n';
      info += '数据键: ' + keys.join(', ') + '\n\n';
      var total = 0;
      for(var i=0; i<keys.length; i++){
        var v = cloudData[keys[i]];
        if(Array.isArray(v)) total += v.length;
        else if(v && v.logs) total += v.logs.length;
      }
      info += '总记录数: ' + total + '\n\n';
      info += '原始JSON(前500字符):\n' + JSON.stringify(cloudData).substring(0,500);
    }
    if(status) status.textContent = info;
    console.log('[CloudSync] debug: ' + info);
  });
}

/* 生成 Service Worker 代码为 blob URL 并注册 */
function setupServiceWorker(){

    '  var isHTML = e.request.mode === "navigate" || e.request.destination === "document";',
    '',
    '  if(isHTML){',
    '    e.respondWith(',
    '      fetch(e.request).then(function(response){',
    '        var clone = response.clone();',
    '        caches.open(CACHE_VER).then(function(cache){ cache.put(e.request, clone); });',
    '        return response;',
    '      }).catch(function(){',
    '        /* 第一层：精确缓存匹配 */',

    '              {headers: {"Content-Type": "text/html; charset=utf-8"}}',
    '            );',
    '          });',
    '        });',

    '  }',
    '',

    '  e.respondWith(',
    '    caches.open(CACHE_VER).then(function(cache){',

    '      });',
    '    })',
    '  );',
    '});',
    '',
    'self.addEventListener("message", function(e){',

  ].join('\n');

<script>
/* ====================================================
   分析报告
   ==================================================== */
function renderAnalysis(){
  var now=new Date(), today=todayStr();
  var feeding=DB.get('feeding',[]);
  var todayFeeding=feeding.filter(function(f){return f.date===today;});
  var todayMilk=todayFeeding.reduce(function(s,f){return s+(+f.amount||0);},0);
  var todayFeedingCount=todayFeeding.length;
  var daily=DB.get('daily',[]);
  var todayPoop=daily.filter(function(d){return d.date===today&&d.type==='poop';});
  var todaySleep=daily.filter(function(d){return d.date===today&&d.type==='sleep';});

  var weekDays=[],monthDays=[];
  for(var i=6;i>=0;i--){var d=new Date(now);d.setDate(d.getDate()-i);weekDays.push(fmtDate(d));}
  for(var i=29;i>=0;i--){var d=new Date(now);d.setDate(d.getDate()-i);monthDays.push(fmtDate(d));}

  var weekFeeding=feeding.filter(function(f){return weekDays.indexOf(f.date)>=0;});
  var weekMilkAvg=Math.round(weekFeeding.reduce(function(s,f){return s+(+f.amount||0);},0)/7);
  var weekPoopCount=daily.filter(function(d){return weekDays.indexOf(d.date)>=0&&d.type==='poop';}).length;
  var weekSleepCount=daily.filter(function(d){return weekDays.indexOf(d.date)>=0&&d.type==='sleep';}).length;

  var monthFeeding=feeding.filter(function(f){return monthDays.indexOf(f.date)>=0;});
  var monthMilkAvg=Math.round(monthFeeding.reduce(function(s,f){return s+(+f.amount||0);},0)/30);
  var monthPoopCount=daily.filter(function(d){return monthDays.indexOf(d.date)>=0&&d.type==='poop';}).length;
  var monthSleepCount=daily.filter(function(d){return monthDays.indexOf(d.date)>=0&&d.type==='sleep';}).length;

  var growth=DB.get('growth',[]).sort(function(a,b){return a.date.localeCompare(b.date);});
  var latestGrowth=growth.length?growth[growth.length-1]:null;

  var dailyAnalysis='';
  if(todayMilk===0) dailyAnalysis+='<div class="ana-item ana-warn">🥛 今日暂无喂奶记录，请及时记录</div>';
  else if(todayMilk<500) dailyAnalysis+='<div class="ana-item ana-warn">🥛 今日奶量'+todayMilk+'ml，4月龄建议日奶量700-900ml，偏低需关注</div>';
  else dailyAnalysis+='<div class="ana-item ana-ok">🥛 今日奶量'+todayMilk+'ml（'+todayFeedingCount+'次），摄入正常</div>';

  if(todayPoop.length===0) dailyAnalysis+='<div class="ana-item ana-info">💩 今日暂无排便记录</div>';
  else todayPoop.forEach(function(p){dailyAnalysis+='<div class="ana-item ana-ok">💩 '+p.time+' 排便 · '+p.color+' · '+p.volume+(p.note?' · '+p.note:'')+'</div>';});

  if(todaySleep.length===0) dailyAnalysis+='<div class="ana-item ana-info">😴 今日暂无睡眠记录</div>';
  else todaySleep.forEach(function(s){dailyAnalysis+='<div class="ana-item ana-ok">😴 '+s.startTime+'→'+s.endTime+' · 时长'+s.duration+'</div>';});

  if(latestGrowth){
    var ageM=ageMonthsTotal();
    var who=getWhoBoy(ageM);
    if(who){
      var h50=who.h[1], w50=who.w[1];
      if(latestGrowth.height){
        var pct=Math.round(latestGrowth.height/h50*100);
        dailyAnalysis+='<div class="ana-item ana-ok">📏 身高'+latestGrowth.height+'cm · 同月龄'+h50+'cm('+pct+'%) · '+(pct>=97?'偏高':pct>=90?'中上':'正常')+'</div>';
      }
      if(latestGrowth.weight){
        var pct2=Math.round(latestGrowth.weight/w50*100);
        dailyAnalysis+='<div class="ana-item ana-ok">⚖️ 体重'+latestGrowth.weight+'kg · 同月龄'+w50+'kg('+pct2+'%) · '+(pct2>=97?'偏高':pct2>=90?'中上':'正常')+'</div>';
      }
    }
  }

  var monthSummary='';
  if(monthFeeding.length) monthSummary+='<div class="ana-item ana-ok">🥛 30天平均日奶量'+monthMilkAvg+'ml</div>';
  if(monthPoopCount) monthSummary+='<div class="ana-item ana-ok">💩 30天排便'+monthPoopCount+'次，日均'+(monthPoopCount/30).toFixed(1)+'次</div>';
  if(monthSleepCount) monthSummary+='<div class="ana-item ana-ok">😴 30天睡眠记录'+monthSleepCount+'次</div>';

  return '<div class="card" style="background:linear-gradient(135deg,#FFF5F5,#FFF9F5)">'+
    '<div class="card-title"><span class="left"><span class="icon">📊</span>宝宝状态分析</span></div>'+
    '<div class="tabs" id="anaTabs"><span class="tab active" onclick="switchAnaTab(\'daily\',event)">📅 日报</span>'+
    '<span class="tab" onclick="switchAnaTab(\'weekly\',event)">📆 周报</span><span class="tab" onclick="switchAnaTab(\'monthly\',event)">🗓 月报</span></div>'+
    '<div id="anaDaily" class="ana-panel active"><div style="font-size:11px;color:var(--text-sub);margin-bottom:8px">📅 '+today+' 今日分析</div>'+
    (dailyAnalysis||'<div class="ana-item ana-info">今日暂无数据，开始记录吧！</div>')+'</div>'+
    '<div id="anaWeekly" class="ana-panel" style="display:none"><div style="font-size:11px;color:var(--text-sub);margin-bottom:8px">📆 '+weekDays[0]+' ~ '+weekDays[6]+' 本周汇总</div>'+
    '<div class="ana-item ana-ok">🥛 本周平均日奶量'+weekMilkAvg+'ml，共'+weekFeeding.length+'次喂养</div>'+
    '<div class="ana-item ana-ok">💩 本周排便'+weekPoopCount+'次，日均'+(weekPoopCount/7).toFixed(1)+'次</div>'+
    '<div class="ana-item ana-ok">😴 本周睡眠记录'+weekSleepCount+'次</div>'+
    '<div class="ana-item ana-info">💡 本周数据持续积累中，规律记录可获得更准确分析</div></div>'+
    '<div id="anaMonthly" class="ana-panel" style="display:none"><div style="font-size:11px;color:var(--text-sub);margin-bottom:8px">🗓 '+monthDays[0]+' ~ '+monthDays[29]+' 本月汇总</div>'+
    (monthSummary||'<div class="ana-item ana-info">本月暂无数据</div>')+
    '<div class="ana-item ana-info">💡 持续记录可查看奶量趋势变化、排便规律、睡眠模式等深度分析</div></div></div>';
}

function switchAnaTab(tab,evt){
  var tabs=document.querySelectorAll('#anaTabs .tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.remove('active');
  if(evt&&evt.target) evt.target.classList.add('active');
  var panels=document.querySelectorAll('.ana-panel');
  for(var j=0;j<panels.length;j++) panels[j].style.display='none';
  var panel=document.getElementById(tab==='daily'?'anaDaily':tab==='weekly'?'anaWeekly':'anaMonthly');
  if(panel) panel.style.display='block';
}

setStatus('分析报告加载完成');
</script>

function getNextVaccine(){
  var vac=DB.get('vaccine',{}), ageM=ageMonthsTotal();
  for(var i=0;i<VACCINE_LIST.length;i++){
    var v=VACCINE_LIST[i];
    if(v.age>=ageM && !(vac[v.name]&&vac[v.name].done)){
      v.overdue=v.age<ageM; return v;
    }
  }
  return null;
}

/* 获取疫苗提醒列表 */
function getVaccineReminders(){
  var vac=DB.get('vaccine',{}), ageM=ageMonthsTotal();
  var reminders=[];
  VACCINE_LIST.forEach(function(v){
    var rec = vac[v.name];
    /* 已按时接种、延迟接种、不接种的都不再提醒 */
    if(rec && (rec.status==='done' || rec.status==='delayed' || rec.status==='skip')) return;
    if(v.age >= ageM && v.age <= ageM+2){
      reminders.push({type:'due', vaccine:v, message:v.ageText+' '+v.name+' 即将接种'});
    } else if(v.age < ageM && v.age >= ageM-3){
      reminders.push({type:'overdue', vaccine:v, message:v.ageText+' '+v.name+' 已到接种时间'});
    }
  });
  return reminders;
}

/* 疫苗排序 */
function getVaccineOrder(){
  return DB.get('vaccineOrder', VACCINE_LIST.map(function(v){return v.name;}));
}
function saveVaccineOrder(order){
  DB.set('vaccineOrder', order);
}

/* 拖拽排序状态 */
var _vacDrag = {active:false, srcIdx:-1, overIdx:-1, startY:0, timer:null};

function vacRowTouchStart(e, idx){
  _vacDrag.startY = e.touches[0].clientY;
  _vacDrag.srcIdx = idx;
  _vacDrag.timer = setTimeout(function(){
    _vacDrag.active = true;
    if(navigator.vibrate) navigator.vibrate(50);
  }, 500);
}

function vacRowTouchMove(e){
  if(!_vacDrag.active) return;
  e.preventDefault();
  var y = e.touches[0].clientY;
  var rows = document.querySelectorAll('tr[data-vac-idx]');
  for(var i=0; i<rows.length; i++){
    var rect = rows[i].getBoundingClientRect();
    if(y >= rect.top && y <= rect.bottom){
      _vacDrag.overIdx = parseInt(rows[i].dataset.vacIdx);
      rows.forEach(function(r){ r.style.borderColor=''; });
      rows[i].style.borderColor = 'var(--c-pink-deep)';
      break;
    }
  }
}

function vacRowTouchEnd(e){
  clearTimeout(_vacDrag.timer);
  if(_vacDrag.active && _vacDrag.overIdx >= 0 && _vacDrag.srcIdx !== _vacDrag.overIdx){
    var order = getVaccineOrder();
    var moved = order.splice(_vacDrag.srcIdx, 1)[0];
    order.splice(_vacDrag.overIdx, 0, moved);
    saveVaccineOrder(order);
    renderModule('vaccine');
  }
  _vacDrag.active = false;
  _vacDrag.srcIdx = -1;
  _vacDrag.overIdx = -1;
}

setStatus('内置数据加载完成');
</script>

function drawFeedingChart(){
  var feeding=DB.get('feeding',[]);
  var days=[];
  for(var i=6;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); days.push(fmtDate(d)); }
  var data=days.map(function(d){ return {date:d, total:feeding.filter(function(f){return f.date===d;}).reduce(function(s,f){return s+(+f.amount||0);},0)}; });
  var max=Math.max.apply(null,data.map(function(d){return d.total;}).concat([200]));
  var W=320,H=160,padL=30,padB=20,padT=10,padR=10;
  var cw=W-padL-padR, ch=H-padT-padB;
  var xStep=data.length>1?cw/(data.length-1):cw;
  var pts=data.map(function(d,i){return [padL+i*xStep, padT+ch-(d.total/max)*ch];});
  var polyline=pts.map(function(p){return p.join(',');}).join(' ');
  var labels=data.map(function(d,i){return '<text x="'+(padL+i*xStep)+'" y="'+(H-6)+'" font-size="9" text-anchor="middle" fill="#999">'+d.date.slice(5)+'</text>';}).join('');
  var yLabels=[0,max/2,max].map(function(v,i){return '<text x="'+(padL-4)+'" y="'+(padT+ch-(v/max)*ch+3)+'" font-size="9" text-anchor="end" fill="#999">'+Math.round(v)+'</text>';}).join('');
  var dots=pts.map(function(p,i){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="#F472A6"/><text x="'+p[0]+'" y="'+(p[1]-6)+'" font-size="9" text-anchor="middle" fill="#F472A6" font-weight="600">'+(data[i].total||'')+'</text>';}).join('');

  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'">'+
    '<line x1="'+padL+'" y1="'+(padT+ch)+'" x2="'+(W-padR)+'" y2="'+(padT+ch)+'" stroke="#E8E0DC"/>'+
    '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+ch)+'" stroke="#E8E0DC"/>'+
    '<line x1="'+padL+'" y1="'+(padT+ch/2)+'" x2="'+(W-padR)+'" y2="'+(padT+ch/2)+'" stroke="#F5EDE9" stroke-dasharray="3,3"/>'+
    yLabels+labels+'<polyline points="'+polyline+'" fill="none" stroke="#F472A6" stroke-width="2.5" stroke-linejoin="round"/>'+dots+'</svg>';
}

  var growth=DB.get('growth',[]).sort(function(a,b){return a.date.localeCompare(b.date);});
  var el=document.getElementById('growthChart'); if(!el) return;
  var W=340,H=200,padL=32,padB=28,padT=14,padR=12;
  var cw=W-padL-padR, ch=H-padT-padB;
  var maxM=12;
  growth.forEach(function(g){ var m=+g.ageMonth||0; if(m>maxM) maxM=m+3; });
  if(maxM<12) maxM=12;

  var months=[]; for(var m=0;m<=maxM;m+=2) months.push(m);
  var xLabels=months.map(function(m){return '<text x="'+(padL+(m/maxM)*cw)+'" y="'+(H-12)+'" font-size="9" text-anchor="middle" fill="#999">'+m+'月</text>';}).join('');
  var content='';

  function drawLine(data,key,color,maxVal){
    var pts=data.map(function(d,i){return [padL+(i/(data.length-1))*cw, padT+ch-(d[key]/maxVal)*ch];});
    var poly=pts.map(function(p){return p.join(',');}).join(' ');
    var dots=pts.map(function(p,i){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="'+color+'"/><text x="'+p[0]+'" y="'+(p[1]-7)+'" font-size="9" text-anchor="middle" fill="'+color+'" font-weight="600">'+data[i][key]+'</text>';}).join('');
    return '<polyline points="'+poly+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/>'+dots;
  }

  if(mode==='both'||mode==='height'){
    var maxH=Math.max.apply(null,growth.map(function(g){return +g.height||0;}).concat([90]));
    var whoMonths=[0,3,6,12,18,24,36,48,60,72].filter(function(m){return m<=maxM&&WHO_BOY[m];});
    if(whoMonths.length){
      var whoPts50=whoMonths.map(function(m){return [padL+(m/maxM)*cw, padT+ch-(WHO_BOY[m].h[1]/maxH)*ch];});
      var whoPts3=whoMonths.map(function(m){return [padL+(m/maxM)*cw, padT+ch-(WHO_BOY[m].h[0]/maxH)*ch];});
      var whoPts97=whoMonths.map(function(m){return [padL+(m/maxM)*cw, padT+ch-(WHO_BOY[m].h[2]/maxH)*ch];});
      var areaPts=whoPts3.concat(whoPts97.reverse()).map(function(p){return p.join(',');}).join(' ');
      content+='<polygon points="'+areaPts+'" fill="#F0FDF4" stroke="none"/>';
      content+='<polyline points="'+whoPts50.map(function(p){return p.join(',');}).join(' ')+'" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4,3"/>';
    }
    content+=drawLine(growth,'height','#34D399',maxH);
  }
  if(mode==='both'||mode==='weight'){
    var maxW=Math.max.apply(null,growth.map(function(g){return +g.weight||0;}).concat([15]));
    if(mode==='weight'){
      var whoMonthsW=[0,3,6,12,18,24,36,48,60,72].filter(function(m){return m<=maxM&&WHO_BOY[m];});
      if(whoMonthsW.length){
        var wp50=whoMonthsW.map(function(m){return [padL+(m/maxM)*cw, padT+ch-(WHO_BOY[m].w[1]/maxW)*ch];});
        var wp3=whoMonthsW.map(function(m){return [padL+(m/maxM)*cw, padT+ch-(WHO_BOY[m].w[0]/maxW)*ch];});
        var wp97=whoMonthsW.map(function(m){return [padL+(m/maxM)*cw, padT+ch-(WHO_BOY[m].w[2]/maxW)*ch];});
        var areaW=wp3.concat(wp97.reverse()).map(function(p){return p.join(',');}).join(' ');
        content+='<polygon points="'+areaW+'" fill="#FEF3C7" stroke="none"/>';
        content+='<polyline points="'+wp50.map(function(p){return p.join(',');}).join(' ')+'" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4,3"/>';
      }
    }
    content+=drawLine(growth,'weight','#60A5FA',maxW);
  }

  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'">'+
    '<line x1="'+padL+'" y1="'+(padT+ch)+'" x2="'+(W-padR)+'" y2="'+(padT+ch)+'" stroke="#E8E0DC"/>'+
    '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+ch)+'" stroke="#E8E0DC"/>'+xLabels+content+'</svg>';
}

  {key:'clean',icon:'🧻',label:'口鼻耳清洁',interval:{春:2,夏:2,秋:2,冬:2},custom:false},
  {key:'facewash',icon:'💦',label:'洗脸',interval:{春:1,夏:1,秋:1,冬:1},custom:false},
  {key:'moisture',icon:'🧴',label:'保湿',interval:{春:1,夏:1,秋:1,冬:1},custom:false}
];

function getNursingItems(){
  var custom = DB.get('nursingCustom', []);
  return NURSING_ITEMS_DEFAULT.concat(custom);
}

function getNursingItemLabel(key){
  var items = getNursingItems();
  for(var i=0; i<items.length; i++){
    if(items[i].key === key) return items[i];
  }
  return null;
}

function renderNursing(){
  var nursing=DB.get('nursing',[]), season=getSeason();
  var items = getNursingItems();

  var cards=items.map(function(it){
    var last=null;
    for(var i=nursing.length-1;i>=0;i--){ if(nursing[i].item===it.key && !nursing[i]._deletedAt){last=nursing[i];break;} }
    var interval=it.interval[season], tip='';
    if(last){
      var lastDt=new Date(last.date+'T'+last.time), next=new Date(lastDt);
      next.setDate(next.getDate()+interval);
      var overdue=next<new Date();
      tip='<div class="tip '+(overdue?'warn':'info')+'">上次:'+last.date.slice(5)+' '+last.time+' · 建议间隔'+interval+'天 · '+(overdue?'⏰已超期':'下次约'+fmtDate(next))+'</div>';
    }else{
      tip='<div class="tip info">尚无记录 · 建议'+season+'季每'+interval+'天一次</div>';
    }
    var delBtn = it.custom ? '<button class="ri-del" onclick="event.stopPropagation();delNursingCustom(\''+it.key+'\')" style="position:absolute;right:4px;top:4px;font-size:14px">×</button>' : '';
    return '<div class="check-item mod-teal" style="position:relative" onclick="quickNursing(\''+it.key+'\',\''+it.label+'\')"><span class="ci-icon">'+it.icon+'</span><div class="ci-label">'+it.label+'</div><div class="ci-status">'+(last?'上次:'+last.date.slice(5):'未记录')+'</div>'+tip+delBtn+'</div>';
  }).join('');

  var filtered = getVisibleRecords('nursing', state.filterDate).slice(0,20);

  var historyHtml='';
  filtered.forEach(function(n){
    var it = getNursingItemLabel(n.item);
    var noteStr = n.note ? ' · '+notePreview(n.note) : '';
    historyHtml+='<div class="record-item" style="cursor:pointer" onclick="showRecordDetail(\'护理详情\', '+JSON.stringify(n).replace(/'/g,"&#39;")+', \'nursing\')"><span style="font-size:20px">'+(it?it.icon:'🧼')+'</span><div class="ri-main"><div class="ri-content">'+(it?it.label:n.item)+noteStr+'</div><div class="ri-time">'+n.date+' '+n.time+' · '+(n.member||'')+'</div></div><button class="ri-del" onclick="event.stopPropagation();delNursing(\''+n.id+'\')">×</button></div>';
  });
  if(!historyHtml) historyHtml='<div class="empty"><span class="icon">🧼</span>暂无记录</div>';

  return subHeader('🧼','护理记录')+memberBar()+
    '<div class="card"><div class="card-title"><span class="left"><span class="icon">🧼</span>护理打卡（'+season+'季建议）</span><button class="btn btn-sm btn-teal" onclick="addNursingCustom()">+自定义</button></div><div style="display:flex;flex-direction:column;gap:8px">'+cards+'</div></div>'+
    '<div class="card"><div class="card-title"><span class="left"><span class="icon">📋</span>护理历史</span><input type="date" id="nurseFilter" value="'+state.filterDate+'" onchange="state.filterDate=this.value;renderModule(\'nursing\')" style="width:auto"></div>'+historyHtml+'</div>';
}
function initNursing(){}

function addNursingCustom(){
  openModal('<div class="modal-header"><h3>➕ 自定义护理项</h3><button class="modal-close" onclick="closeModal()">×</button></div>'+
    '<div class="form-row"><div class="form-group"><label>护理名称</label><input type="text" id="nc_label" placeholder="如：补水、抚触、红臀护理"></div></div>'+
    '<div class="form-row"><div class="form-group" style="flex:1"><label>图标(emoji)</label><input type="text" id="nc_icon" placeholder="如：💧" value="🧴"></div>'+
    '<div class="form-group" style="flex:1"><label>建议间隔(天)</label><input type="number" id="nc_interval" value="1" min="1"></div></div>'+
    '<button class="btn btn-primary btn-block" onclick="saveNursingCustom()">保存</button>');
}

function saveNursingCustom(){

  var custom=DB.get('nursingCustom',[]);
  custom.push({key:'custom_'+Date.now(),icon:icon,label:label,interval:{春:interval,夏:interval,秋:interval,冬:interval},custom:true});

    '<div class="form-row"><div class="form-group"><label>护理时间</label><input type="datetime-local" id="n_time" value="'+nowDT()+'"></div></div>'+
    '<div class="form-row"><div class="form-group" style="flex:2"><label>备注(选填)</label><input type="text" id="n_note" placeholder="如：水温36度"></div></div>'+
    '<button class="btn btn-primary btn-block" onclick="saveNursing(\''+key+'\')">保存</button>');

function saveNursing(key){
  var t=document.getElementById('n_time').value; if(!t){toast('请填写时间');return;}

  var rec={id:String(Date.now())+'_'+Math.random().toString(36).substr(2,5),item:key,date:fmtDate(d),time:fmtTime(d),note:document.getElementById('n_note').value,member:state.currentMember,_ts:String(Date.now())};
  var nursing=DB.get('nursing',[]); nursing.push(rec); DB.set('nursing',nursing);
  closeModal(); toast('已记录✅'); renderModule('nursing');

function delNursing(id){
  if(!confirm('确认删除？')) return;
  var n=DB.get('nursing',[]);
  for(var i=0;i<n.length;i++){
    if(n[i].id===id){
      n[i]._deletedAt=new Date().toISOString();
      n[i]._ts=String(Date.now());
      break;
    }
  }
  DB.set('nursing',n);
  toast('已删除'); renderModule('nursing');
}

setStatus('护理记录加载完成');

<script>
/* ====================================================
   疫苗接种
   ==================================================== */
function renderVaccine(){
  var vac=DB.get('vaccine',{}), ageM=ageMonthsTotal();
  var order = getVaccineOrder();
  var vacList = order.map(function(name){
    for(var i=0; i<VACCINE_LIST.length; i++){
      if(VACCINE_LIST[i].name === name) return VACCINE_LIST[i];
    }
    return null;
  }).filter(function(v){ return v; });

  var html=subHeader('💉','疫苗接种')+memberBar()+
    '<div class="tip info" style="margin-bottom:10px">📋 长按拖拽排序，点击查看详情。支持标记：按时接种/延迟接种/不接种</div>'+
    '<div class="card"><div class="card-title"><span class="left"><span class="icon">💉</span>疫苗计划表（当前'+ageM+'月龄）</span><button class="btn btn-sm btn-primary" style="background:var(--c-pink-deep);border-radius:20px;width:32px;height:32px;font-size:18px;padding:0" onclick="addCustomVaccine()">+</button></div><div class="table-wrap"><table><thead><tr><th style="width:30px">⇅</th><th>月龄</th><th>疫苗名称</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody>';

  vacList.forEach(function(v, idx){
    var st=vac[v.name];
    var isNext = !st && v.age>=ageM;
    var bg = '';
    if(st){
      if(st.status==='done') bg='';
      else if(st.status==='delayed') bg='background:#FFF3E0';
      else if(st.status==='skip') bg='background:#F5F5F5';
    } else if(isNext){
      bg='background:#FEF3C7';
    }
    var statusBadge = '';
    if(st){
      if(st.status==='done') statusBadge='<span class="badge badge-done">已接种</span>';
      else if(st.status==='delayed') statusBadge='<span class="badge" style="background:#FFE0B2;color:#E65100">延迟接种</span>';
      else if(st.status==='skip') statusBadge='<span class="badge" style="background:#E0E0E0;color:#757575">不接种</span>';
    } else {
      statusBadge = isNext ? '<span class="badge badge-pending">待接种</span>' : '<span class="badge badge-pending">未接种</span>';
    }
    var reactionPreview = (st&&st.reaction) ? ' · '+notePreview(st.reaction,10) : '';
    var notePreviewStr = (st&&st.status==='skip'&&st.skipReason) ? ' · '+notePreview(st.skipReason,10) : '';
    var actionLabel = st ? '编辑' : '标记';
    html+='<tr data-vac-idx="'+idx+'" style="'+bg+'" ontouchstart="vacRowTouchStart(event,'+idx+')" ontouchmove="vacRowTouchMove(event)" ontouchend="vacRowTouchEnd(event)" onclick="showVaccineDetail(\''+v.name.replace(/'/g,"\\'")+'\')">'+
      '<td style="cursor:move;font-size:14px;color:#999">⠿</td>'+
      '<td>'+v.ageText+'</td>'+
      '<td style="white-space:normal;max-width:110px">'+v.name+'<br><span style="font-size:10px;color:#999">'+(v.desc||'')+'</span></td>'+
      '<td><span class="badge '+(v.type.indexOf('免费')>=0?'badge-free':'badge-paid')+'">'+v.type+'</span></td>'+
      '<td>'+statusBadge+reactionPreview+notePreviewStr+'</td>'+
      '<td><button class="btn btn-sm '+(st?'btn-ghost':'btn-green')+'" onclick="event.stopPropagation();markVaccine(\''+v.name.replace(/'/g,"\\'")+'\')">'+actionLabel+'</button></td></tr>';
  });
  html+='</tbody></table></div></div>';

  /* 已处理记录（按时+延迟+不接种）按日期倒序 */
  var doneKeys=Object.keys(vac).filter(function(k){return vac[k] && (vac[k].status==='done'||vac[k].status==='delayed'||vac[k].status==='skip');});
  if(doneKeys.length){
    doneKeys.sort(function(a,b){ return (vac[b].date||'').localeCompare(vac[a].date||''); });
    html+='<div class="card"><div class="card-title"><span class="left"><span class="icon">📝</span>疫苗记录</span></div>';
    doneKeys.forEach(function(k){
      var v=vac[k];
      var statusIcon = v.status==='done'?'✅':v.status==='delayed'?'⏰':'⏭️';
      var statusText = v.status==='done'?'已接种':v.status==='delayed'?'延迟接种':'不接种';
      var detail = v.status==='skip' ? (v.skipReason||'未填写原因') : (v.reaction||'无不良反应');
      html+='<div class="record-item" style="cursor:pointer" onclick="showVaccineDetail(\''+k.replace(/'/g,"\\'")+'\')"><div class="ri-main"><div class="ri-content">'+statusIcon+' '+k+'</div><div class="ri-time">'+statusText+' · '+(v.date||'')+' · '+(v.member||'')+'</div><div class="ri-time" style="color:#999">备注: '+notePreview(detail,15)+'</div></div><button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();editVaccine(\''+k.replace(/'/g,"\\'")+'\')">编辑</button></div>';
    });
    html+='</div>';
  }
  return html;
}

/* 新增自定义疫苗 */
function addCustomVaccine(){
  openModal('<div class="modal-header"><h3>➕ 新增疫苗</h3><button class="modal-close" onclick="closeModal()">×</button></div>'+
    '<div class="form-row"><div class="form-group" style="flex:2"><label>疫苗名称</label><input type="text" id="cv_name" placeholder="如：轮状病毒疫苗"></div></div>'+
    '<div class="form-row"><div class="form-group" style="flex:1"><label>建议月龄</label><input type="text" id="cv_age" placeholder="如：6月龄" value="'+ageMonthsTotal()+'月龄"></div>'+
    '<div class="form-group" style="flex:1"><label>类型</label><select id="cv_type"><option value="自费">自费</option><option value="免费">免费</option></select></div></div>'+
    '<div class="form-row"><div class="form-group" style="flex:2"><label>说明(选填)</label><input type="text" id="cv_desc" placeholder="如：预防轮状病毒腹泻"></div></div>'+
    '<button class="btn btn-primary btn-block" onclick="saveCustomVaccine()">添加</button>');
