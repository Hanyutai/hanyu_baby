function saveCustomVaccine(){
  var name=document.getElementById('cv_name').value.trim();
  if(!name){toast('请输入疫苗名称');return;}
  var ageText=document.getElementById('cv_age').value.trim()||'自定义';
  var type=document.getElementById('cv_type').value;
  var desc=document.getElementById('cv_desc').value.trim();
  /* 添加到VACCINE_LIST和排序 */
  VACCINE_LIST.push({age:999,ageText:ageText,name:name,type:type,desc:desc,precaution:'',custom:true});
  var order=getVaccineOrder();
  order.push(name);
  saveVaccineOrder(order);
  closeModal(); toast('已添加✅'); renderModule('vaccine');
}

function showVaccineDetail(name){
  var vac=DB.get('vaccine',{}), v=vac[name];
  var vacInfo = null;
  for(var i=0; i<VACCINE_LIST.length; i++){
    if(VACCINE_LIST[i].name === name){ vacInfo = VACCINE_LIST[i]; break; }
  }
  var html='<div class="modal-header"><h3>💉 疫苗详情</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
  html+='<div style="padding:12px">';
  html+='<div style="font-weight:700;font-size:16px;margin-bottom:10px">'+name+'</div>';
  if(vacInfo){
    html+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0E8E4"><span style="color:var(--text-sub)">建议月龄</span><span>'+vacInfo.ageText+'</span></div>';
    html+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0E8E4"><span style="color:var(--text-sub)">类型</span><span>'+(vacInfo.type||'')+'</span></div>';
    if(vacInfo.desc) html+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0E8E4"><span style="color:var(--text-sub)">说明</span><span style="text-align:right">'+vacInfo.desc+'</span></div>';
    if(vacInfo.precaution){
      html+='<div style="padding:8px 0;border-bottom:1px solid #F0E8E4"><div style="color:var(--text-sub);font-size:12px;margin-bottom:6px">📋 接种注意事项</div><div style="background:#FEF3C7;padding:10px;border-radius:8px;font-size:13px;line-height:1.6">'+vacInfo.precaution+'</div></div>';
    }
  }
  if(v){
    var statusText = v.status==='done'?'按时接种':v.status==='delayed'?'延迟接种':'不接种';
    html+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0E8E4"><span style="color:var(--text-sub)">状态</span><span style="font-weight:600">'+statusText+'</span></div>';
    if(v.date) html+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0E8E4"><span style="color:var(--text-sub)">日期</span><span>'+v.date+'</span></div>';
    html+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0E8E4"><span style="color:var(--text-sub)">记录人</span><span>'+(v.member||'')+'</span></div>';
    if(v.status==='skip' && v.skipReason){
      html+='<div style="padding:8px 0;border-bottom:1px solid #F0E8E4"><div style="color:var(--text-sub);font-size:12px;margin-bottom:6px">不接种原因</div><div style="background:#F5F5F5;padding:10px;border-radius:8px;font-size:13px;line-height:1.6">'+v.skipReason+'</div></div>';
    }
    if(v.reaction){
      html+='<div style="padding:8px 0;border-bottom:1px solid #F0E8E4"><div style="color:var(--text-sub);font-size:12px;margin-bottom:6px">不良反应/备注</div><div style="background:#FEF3C7;padding:10px;border-radius:8px;font-size:13px;line-height:1.6">'+v.reaction+'</div></div>';
    }
    html+='<button class="btn btn-primary btn-block" style="margin-top:10px" onclick="editVaccine(\''+name.replace(/'/g,"\\'")+'\')">编辑</button>';
  } else {
    html+='<div class="tip info" style="margin:10px 0">尚未处理此疫苗</div>';
    html+='<button class="btn btn-green btn-block" onclick="closeModal();markVaccine(\''+name.replace(/'/g,"\\'")+'\')">标记接种</button>';
  }
  html+='</div>';
  openModal(html);
}

function markVaccine(name){
  var vac=DB.get('vaccine',{});
  var existing = vac[name];
  /* 如果已处理，点击取消 */
  if(existing && (existing.status==='done'||existing.status==='delayed'||existing.status==='skip')){
    if(!confirm('取消'+name+'的记录？')) return;
    delete vac[name]; DB.set('vaccine',vac); toast('已取消'); renderModule('vaccine'); return;
  }
  /* 弹窗：选择状态 */
  openModal('<div class="modal-header"><h3>💉 '+name+'</h3><button class="modal-close" onclick="closeModal()">×</button></div>'+
    '<div style="padding:12px">'+
    '<div style="display:flex;flex-direction:column;gap:10px">'+
    '<button class="btn btn-green btn-block" style="padding:14px" onclick="showVaccineForm(\''+name.replace(/'/g,"\\'")+'\',\'done\')">✅ 按时接种</button>'+
    '<button class="btn btn-block" style="padding:14px;background:#FFE0B2;color:#E65100" onclick="showVaccineForm(\''+name.replace(/'/g,"\\'")+'\',\'delayed\')">⏰ 延迟接种</button>'+
    '<button class="btn btn-block" style="padding:14px;background:#E0E0E0;color:#616161" onclick="showVaccineForm(\''+name.replace(/'/g,"\\'")+'\',\'skip\')">⏭️ 不接种</button>'+
    '</div></div>');
}

function showVaccineForm(name, status){
  var vac=DB.get('vaccine',{}), v=vac[name]||{};
  var title = status==='done'?'按时接种':status==='delayed'?'延迟接种':'不接种';
  var dateField = status==='skip' ? '' :
    '<div class="form-row"><div class="form-group"><label>'+(status==='delayed'?'实际接种':'接种')+'日期</label><input type="date" id="v_date" value="'+(v.date||todayStr())+'"></div></div>';
  var reactionField = status==='skip' ? '' :
    '<div class="form-row"><div class="form-group" style="flex:2"><label>不良反应/备注(选填)</label><textarea id="v_reaction" placeholder="如：低烧38度、局部红肿">'+(v.reaction||'')+'</textarea></div></div>';
  var skipField = status==='skip' ?
    '<div class="form-row"><div class="form-group" style="flex:2"><label>不接种原因</label><textarea id="v_skipReason" placeholder="如：宝宝发烧暂缓、已接种其他品牌、家长选择不接种">'+(v.skipReason||'')+'</textarea></div></div>' : '';
  
  openModal('<div class="modal-header"><h3>💉 '+title+'</h3><button class="modal-close" onclick="closeModal()">×</button></div>'+
    '<div style="font-size:14px;font-weight:600;margin-bottom:10px">'+name+'</div>'+memberBar()+
    dateField+reactionField+skipField+
    '<button class="btn btn-primary btn-block" onclick="saveVaccineStatus(\''+name.replace(/'/g,"\\'")+'\',\''+status+'\')">确认'+title+'</button>');
  renderMemberChips();
}

function saveVaccineStatus(name, status){
  var vac=DB.get('vaccine',{});
  var rec = {status:status, member:state.currentMember, _ts:String(Date.now())};
  if(status !== 'skip'){
    rec.date = document.getElementById('v_date').value;
    rec.reaction = document.getElementById('v_reaction').value;
  } else {
    rec.skipReason = document.getElementById('v_skipReason').value;
    rec.date = todayStr();
  }
  vac[name] = rec;
  DB.set('vaccine',vac); closeModal(); toast('已记录✅'); renderModule('vaccine');
}

/* 兼容旧版saveVaccine */
function saveVaccine(name){
  saveVaccineStatus(name, 'done');
}

function editVaccine(name){
  var vac=DB.get('vaccine',{}), v=vac[name];
  if(!v) { markVaccine(name); return; }
  /* 根据已有状态显示对应编辑表单 */
  showVaccineForm(name, v.status||'done');
}

setStatus('疫苗接种加载完成');
</script>
<script>
/* ====================================================
   早教
   ==================================================== */

/* 月龄段早教方案（保留原数据，用于自动生成打卡清单） */
var EARLY_EDU_BLOCKS = [
  {range:[0,2],title:'0-2月',bigMotor:'俯卧抬头练习、被动操',fineMotor:'抓握反射训练（摇铃）',logic:'黑白卡追视',music:'轻柔摇篮曲、白噪音',lang:'多与宝宝说话、模仿发音'},
  {range:[2,4],title:'2-4月',bigMotor:'翻身练习、竖抱抬头',fineMotor:'抓握玩具、手摇铃',logic:'彩色卡追视、摇铃寻声',music:'不同节奏音乐律动',lang:'回应宝宝咿呀声、讲故事'},
  {range:[4,6],title:'4-6月',bigMotor:'靠坐→独坐、翻身翻滚',fineMotor:'双手传递玩具、撕纸',logic:'镜子游戏、藏猫猫',music:'敲打乐器（沙锤）',lang:'指认物品命名、儿歌'},
  {range:[6,8],title:'6-8月',bigMotor:'独坐稳、匍匐爬行',fineMotor:'拇指食指捏（溶豆）、敲打积木',logic:'物体恒存（盖巾找玩具）',music:'随音乐摇摆、拍手',lang:'ma/ba/dada发音练习、叫名字回应'},
  {range:[8,10],title:'8-10月',bigMotor:'手膝爬行、扶站',fineMotor:'食指戳洞、捏小物',logic:'因果玩具（按键琴）、投入取出',music:'跟随节奏拍手跺脚',lang:'理解"不""再见"、模仿手势'},
  {range:[10,12],title:'10-12月',bigMotor:'扶走→独站→独走几步',fineMotor:'拇指食指精确捏、翻书页',logic:'套圈、形状盒',music:'敲击不同音高乐器',lang:'叫爸爸/妈妈有意识、单词表达'},
  {range:[12,15],title:'12-15月',bigMotor:'独走稳、爬楼梯（扶）',fineMotor:'搭2-3块积木、握笔涂鸦',logic:'简单拼图（2-3块）',music:'跟着音乐跳舞',lang:'5-10个词、指认身体部位'},
  {range:[15,18],title:'15-18月',bigMotor:'跑、倒退走、踢球',fineMotor:'搭4-6块积木、穿线',logic:'配对游戏、形状分类',music:'唱简单歌词',lang:'20个词、两字短语'},
  {range:[18,24],title:'18-24月',bigMotor:'双脚跳、上下楼梯',fineMotor:'翻书、拧瓶盖',logic:'颜色配对、大小排序',music:'节奏模仿',lang:'简单句子、说出自己名字'},
  {range:[24,30],title:'2-2.5岁',bigMotor:'单脚站、骑三轮车',fineMotor:'画圆、剪刀剪',logic:'数1-5、简单迷宫',music:'哼唱整首歌',lang:'3-4字短句、问答'},
  {range:[30,36],title:'2.5-3岁',bigMotor:'单脚跳、平衡木',fineMotor:'画十字、折纸',logic:'数1-10、找不同',music:'识别旋律',lang:'完整句子、背儿歌'}
];

/* 默认早教打卡项（按月龄段生成内容） */
var EARLY_EDU_ITEMS_DEFAULT = [
  {key:'bigMotor',icon:'🏃',label:'大运动',category:'大运动'},
  {key:'fineMotor',icon:'✋',label:'精细动作',category:'精细动作'},
  {key:'logic',icon:'🧩',label:'逻辑思维',category:'认知启蒙'},
  {key:'music',icon:'🎵',label:'音乐启蒙',category:'艺术启蒙'},
  {key:'lang',icon:'🗣️',label:'语言启蒙',category:'语言启蒙'}
];

function getEarlyEduBlock(){
  var m=ageMonthsTotal();
  for(var i=0;i<EARLY_EDU_BLOCKS.length;i++){ if(m>=EARLY_EDU_BLOCKS[i].range[0]&&m<EARLY_EDU_BLOCKS[i].range[1]) return EARLY_EDU_BLOCKS[i]; }
  return EARLY_EDU_BLOCKS[EARLY_EDU_BLOCKS.length-1];
}

/* 获取所有早教打卡项（默认+自定义） */
function getEarlyEduItems(){
  var custom = DB.get('earlyeduCustom', []);
  return EARLY_EDU_ITEMS_DEFAULT.concat(custom);
}

/* 获取某项在当前月龄的内容描述 */
function getEarlyEduItemContent(key){
  var block = getEarlyEduBlock();
  if(block[key]) return block[key];
  return '';
}

/* 获取今日已打卡的早教项key列表 */
function getTodayEduDoneKeys(){
  var edu = DB.get('earlyedu', []);
  var today = todayStr();
  var doneKeys = {};
  edu.forEach(function(r){
    if(r.date === today && !r._deletedAt) doneKeys[r.item] = true;
  });
  return doneKeys;
}

/* 计算连续打卡天数 */
function getEduStreakDays(){
  var edu = DB.get('earlyedu', []);
  var dateSet = {};
  edu.forEach(function(r){
    if(!r._deletedAt && r.date) dateSet[r.date] = true;
  });
  var streak = 0;
  var d = new Date();
  while(true){
    var ds = fmtDate(d);
    if(dateSet[ds]){
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

/* 获取最近N天的打卡情况（用于日历展示） */
function getEduCalendarData(days){
  var edu = DB.get('earlyedu', []);
  var result = [];
  var today = todayStr();
  var d = new Date();
  for(var i = days - 1; i >= 0; i--){
    var checkDate = new Date(d);
    checkDate.setDate(checkDate.getDate() - i);
    var ds = fmtDate(checkDate);
    var count = 0;
    edu.forEach(function(r){
      if(r.date === ds && !r._deletedAt) count++;
    });
    var isToday = (ds === today);
    var weekday = ['日','一','二','三','四','五','六'][checkDate.getDay()];
    result.push({date:ds, day:checkDate.getDate(), count:count, isToday:isToday, weekday:weekday, fullDate:ds});
  }
  return result;
}

function renderEarlyEdu(){
  var m = ageMonthsTotal();
  var cur = getEarlyEduBlock();
  var items = getEarlyEduItems();
  var todayDone = getTodayEduDoneKeys();
  var streak = getEduStreakDays();
  var todayCount = 0;
  for(var k in todayDone) { if(todayDone.hasOwnProperty(k)) todayCount++; }

  /* 月龄信息卡 */
  var html = subHeader('🧠','早教') + memberBar() +
    '<div class="card" style="background:linear-gradient(135deg,var(--c-purple-light),#fff)"><div style="text-align:center;padding:6px 0">'+
    '<div style="font-size:36px">🧠</div>'+
    '<div style="font-size:16px;font-weight:700;margin:4px 0">当前月龄：'+m+'月</div>'+
    '<div class="tip info" style="display:inline-block">适配方案：'+cur.title+'阶段 · 内容随月龄自动更新</div></div></div>';

  /* 连续打卡 + 日历 */
  var calData = getEduCalendarData(14);
  var calCells = calData.map(function(c){
    var bg = c.count > 0 ? 'var(--c-green-deep)' : '#E5E5E5';
    var color = c.count > 0 ? '#fff' : '#999';
    var border = c.isToday ? '2px solid var(--c-pink-deep)' : '2px solid transparent';
    return '<div style="text-align:center;flex:1" onclick="showEduDayDetail(\''+c.fullDate+'\')">'+
      '<div style="font-size:10px;color:var(--text-sub);margin-bottom:2px">'+c.weekday+'</div>'+
      '<div style="width:28px;height:28px;border-radius:50%;background:'+bg+';color:'+color+';display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin:0 auto;border:'+border+'">'+c.day+'</div>'+
      '<div style="font-size:9px;color:'+(c.count>0?'var(--c-green-deep)':'#ccc')+';margin-top:2px">'+(c.count>0?c.count+'项':'-')+'</div>'+
      '</div>';
  }).join('');

  html += '<div class="card"><div class="card-title"><span class="left"><span class="icon">🔥</span>连续打卡</span>'+
    '<span style="font-size:13px;color:var(--c-pink-deep);font-weight:700">'+streak+'天</span></div>'+
    '<div style="display:flex;overflow-x:auto;gap:2px;padding:4px 0">'+calCells+'</div>'+
    '<div style="text-align:center;margin-top:8px;font-size:12px;color:var(--text-sub)">今日已打卡 '+todayCount+'/'+items.length+' 项</div></div>';

  /* 每日打卡清单 */
  var cards = items.map(function(it){
    var done = todayDone[it.key];
    var content = getEarlyEduItemContent(it.key);
    var delBtn = it.custom ? '<button class="ri-del" onclick="event.stopPropagation();delEduCustom(\''+it.key+'\')" style="position:absolute;right:4px;top:4px;font-size:14px">×</button>' : '';
    var contentHtml = content ? '<div style="text-align:left;width:100%;font-size:13px;line-height:1.6;color:var(--text-sub);margin-top:4px">'+content+'</div>' : '';
    return '<div class="card" style="position:relative">'+
      '<div class="card-title"><span class="left"><span class="icon">'+it.icon+'</span>'+it.label+(it.custom?' <span style="font-size:10px;color:var(--c-pink-deep)">自定义</span>':'')+'</span>'+
      '<button class="btn btn-sm '+(done?'btn-green':'btn-ghost')+'" onclick="toggleEdu(\''+it.key+'\')">'+(done?'✅已完成':'打卡')+'</button></div>'+
      contentHtml + delBtn + '</div>';
  }).join('');

  html += '<div class="card"><div class="card-title"><span class="left"><span class="icon">📋</span>每日打卡清单</span>'+
    '<button class="btn btn-sm btn-purple" onclick="addEduCustom()">+自定义</button></div>'+
    '<div style="font-size:12px;color:var(--text-sub);margin-bottom:8px">点击"打卡"完成今日训练，可添加备注</div></div>'+
    cards;

  /* 历史记录（倒序） */
  var filtered = getVisibleRecords('earlyedu', state.filterDate).slice(0, 30);
  var historyHtml = '';
  filtered.forEach(function(r){
    var it = null;
    for(var i=0; i<items.length; i++){ if(items[i].key === r.item){ it = items[i]; break; } }
    var noteStr = r.note ? ' · '+notePreview(r.note) : '';
    historyHtml += '<div class="record-item" style="cursor:pointer" onclick="showRecordDetail(\'早教详情\', '+JSON.stringify(r).replace(/'/g,"&#39;")+', \'earlyedu\')">'+
      '<span style="font-size:20px">'+(it?it.icon:'🧠')+'</span>'+
      '<div class="ri-main"><div class="ri-content">'+(it?it.label:r.item)+noteStr+'</div>'+
      '<div class="ri-time">'+r.date+' '+(r.time||'')+' · '+(r.member||'')+'</div></div>'+
      '<button class="ri-del" onclick="event.stopPropagation();delEdu(\''+r.id+'\')">×</button></div>';
  });
  if(!historyHtml) historyHtml = '<div class="empty"><span class="icon">🧠</span>暂无早教记录</div>';

  html += '<div class="card"><div class="card-title"><span class="left"><span class="icon">📜</span>历史记录</span>'+
    '<input type="date" id="eduFilter" value="'+state.filterDate+'" onchange="state.filterDate=this.value;renderModule(\'earlyedu\')" style="width:auto"></div>'+
    historyHtml + '</div>';

  return html;
}

function initEarlyEdu(){}

/* 打卡/取消打卡 */
function toggleEdu(key){
  var edu = DB.get('earlyedu', []);
  var today = todayStr();
  /* 检查今日是否已打卡此项 */
  var existIdx = -1;
  for(var i=0; i<edu.length; i++){
    if(edu[i].item === key && edu[i].date === today && !edu[i]._deletedAt){ existIdx = i; break; }
  }
  if(existIdx >= 0){
    /* 已打卡 → 取消 */
    if(!confirm('取消今日此项打卡？')) return;
    edu[existIdx]._deletedAt = new Date().toISOString();
    edu[existIdx]._ts = String(Date.now());
    DB.set('earlyedu', edu);
    toast('已取消'); renderModule('earlyedu'); return;
  }
  /* 未打卡 → 弹窗填写备注 */
  openEduCheckModal(key);
}

function openEduCheckModal(key){
  var items = getEarlyEduItems();
  var it = null;
  for(var i=0; i<items.length; i++){ if(items[i].key === key){ it = items[i]; break; } }
  var label = it ? it.label : key;
  var icon = it ? it.icon : '🧠';
  var content = getEarlyEduItemContent(key);
  var contentTip = content ? '<div class="tip info" style="margin-bottom:10px">📌 本月龄建议：'+content+'</div>' : '';
  openModal('<div class="modal-header"><h3>'+icon+' '+label+'打卡</h3><button class="modal-close" onclick="closeModal()">×</button></div>'+
    memberBar() + contentTip +
    '<div class="form-row"><div class="form-group"><label>时间</label><input type="datetime-local" id="ee_time" value="'+nowDT()+'"></div></div>'+
    '<div class="form-row"><div class="form-group" style="flex:2"><label>训练备注(选填)</label><textarea id="ee_note" placeholder="如：今天练习了10分钟，宝宝很喜欢追视卡片"></textarea></div></div>'+
    '<button class="btn btn-primary btn-block" onclick="saveEdu(\''+key+'\')">✅ 确认打卡</button>');
  renderMemberChips();
}

function saveEdu(key){
  var t = document.getElementById('ee_time').value;
  if(!t){ toast('请填写时间'); return; }
  var d = new Date(t);
  var rec = {
    id: String(Date.now())+'_'+Math.random().toString(36).substr(2,5),
    item: key,
    date: fmtDate(d),
    time: fmtTime(d),
    note: document.getElementById('ee_note').value,
    member: state.currentMember,
    _ts: String(Date.now())
  };
  var edu = DB.get('earlyedu', []);
  edu.push(rec);
  DB.set('earlyedu', edu);
  closeModal(); toast('已打卡✅'); renderModule('earlyedu');
}

function delEdu(id){
  if(!confirm('确认删除？')) return;
  var edu = DB.get('earlyedu', []);
  for(var i=0; i<edu.length; i++){
    if(edu[i].id === id){
      edu[i]._deletedAt = new Date().toISOString();
      edu[i]._ts = String(Date.now());
      break;
    }
  }
  DB.set('earlyedu', edu);
  toast('已删除'); renderModule('earlyedu');
}

/* 自定义早教项 */
function addEduCustom(){
  openModal('<div class="modal-header"><h3>➕ 自定义早教项</h3><button class="modal-close" onclick="closeModal()">×</button></div>'+
    '<div class="form-row"><div class="form-group"><label>项目名称</label><input type="text" id="ee_label" placeholder="如：感统训练、户外探索"></div></div>'+
    '<div class="form-row"><div class="form-group" style="flex:1"><label>图标(emoji)</label><input type="text" id="ee_icon" placeholder="如：🎨" value="🎯"></div>'+

function saveEduCustom(){

  var custom = DB.get('earlyeduCustom', []);
  custom.push({
    key: 'custom_'+Date.now(),
    icon: icon,
    label: label,
    category: category,
    content: content,
    custom: true
  });

}

function delEduCustom(key){

  custom = custom.filter(function(c){ return c.key !== key; });
  DB.set('earlyeduCustom', custom);
  toast('已删除'); renderModule('earlyedu');
}

/* 查看某天打卡详情 */
function showEduDayDetail(dateStr){
  var edu = DB.get('earlyedu', []);
  var items = getEarlyEduItems();
  var dayRecords = edu.filter(function(r){ return r.date === dateStr && !r._deletedAt; });
  if(dayRecords.length === 0){
    toast(dateStr.slice(5) + ' 无打卡记录');
    return;
  }
  var html = '<div class="modal-header"><h3>🧠 '+dateStr.slice(5)+' 早教记录</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
  html += '<div style="padding:12px">';
  dayRecords.forEach(function(r){
    var it = null;
    for(var i=0; i<items.length; i++){ if(items[i].key === r.item){ it = items[i]; break; } }
    html += '<div class="record-item" style="cursor:pointer" onclick="showRecordDetail(\'早教详情\', '+JSON.stringify(r).replace(/'/g,"&#39;")+', \'earlyedu\')">'+
      '<span style="font-size:20px">'+(it?it.icon:'🧠')+'</span>'+
      '<div class="ri-main"><div class="ri-content">'+(it?it.label:r.item)+'</div>'+
      '<div class="ri-time">'+(r.time||'')+' · '+(r.member||'')+(r.note?' · '+notePreview(r.note):'')+'</div></div></div>';
  });
  html += '</div>';
  openModal(html);
}

/* 获取首页早教今日待办 */
function getEarlyEduTodos(){
  var items = getEarlyEduItems();
  var todayDone = getTodayEduDoneKeys();
  var todos = [];
  items.forEach(function(it){
    if(!todayDone[it.key]){
      todos.push({
        key: it.key,
        icon: it.icon,
        label: it.label,
        content: getEarlyEduItemContent(it.key)
      });
    }
  });
  return todos;
}

function getCurrentRecipe(){
  var m=ageMonthsTotal(); if(m<6) return null;
  var keys=Object.keys(FOOD_RECIPES).map(Number).sort(function(a,b){return a-b;});
  var cur=FOOD_RECIPES[6];
  for(var i=0;i<keys.length;i++){ if(m>=keys[i]) cur=FOOD_RECIPES[keys[i]]; }
  return cur;
}

function showRecipeDetail(recipe, itemName){
  var item = null;
  recipe.items.forEach(function(it){ if(it.name === itemName) item = it; });
  if(!item) return;
  var html='<div class="modal-header"><h3>🥦 '+item.name+'</h3><button class="modal-close" onclick="closeModal()">×</button></div>';
  html+='<div style="padding:12px">';
  if(item.nutrition){
    html+='<div class="tip info" style="margin-bottom:8px">💪 营养：'+item.nutrition+'</div>';
  }
  if(item.portion){
    html+='<div class="tip info" style="margin-bottom:8px">⚖️ 建议份量：'+item.portion+'</div>';
  }
  if(item.allergen){
    html+='<div class="tip warn" style="margin-bottom:8px">⚠️ 高敏食物，首次少量尝试，观察3天无过敏反应再加量</div>';
  }
  if(item.steps && item.steps.length){
    html+='<div style="font-weight:700;margin:10px 0 8px">📋 制作步骤：</div>';
    item.steps.forEach(function(s, i){
      html+='<div style="display:flex;gap:10px;margin-bottom:10px"><div style="width:24px;height:24px;background:var(--c-green-deep);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">'+(i+1)+'</div><div style="font-size:13px;line-height:1.6;padding-top:2px">'+s+'</div></div>';

function addFoodLog(){
  openModal('<div class="modal-header"><h3>📝 辅食记录</h3><button class="modal-close" onclick="closeModal()">×</button></div>'+memberBar()+
    '<div class="form-row"><div class="form-group"><label>时间</label><input type="datetime-local" id="fl_time" value="'+nowDT()+'"></div></div>'+
    '<div class="form-row"><div class="form-group" style="flex:2"><label>食材/菜品</label><input type="text" id="fl_foods" placeholder="如：南瓜米粉泥"></div></div>'+
    '<div class="form-row"><div class="form-group" style="flex:2"><label>不良反应(选填)</label><input type="text" id="fl_reaction" placeholder="如：皮疹、腹泻"></div></div>'+
    '<button class="btn btn-primary btn-block" onclick="saveFoodLog()">保存</button>');
  renderMemberChips();
}
function saveFoodLog(){
  var t=document.getElementById('fl_time').value; if(!t){toast('请填写时间');return;}
  var d=new Date(t);
  var foods=document.getElementById('fl_foods').value.trim();
  if(!foods){toast('请输入食材');return;}
  var food=DB.get('food',{blacklist:[],logs:[]});
  var risky=null;
  for(var i=0;i<food.blacklist.length;i++){ if(foods.indexOf(food.blacklist[i])>=0){risky=food.blacklist[i];break;} }
  if(risky&&!confirm('⚠️ 风险提醒：'+foods+' 含过敏黑名单中的"'+risky+'"，确认添加？')) return;
  var rec={id:String(Date.now())+'_'+Math.random().toString(36).substr(2,5),date:fmtDate(d),time:fmtTime(d),foods:foods,reaction:document.getElementById('fl_reaction').value,member:state.currentMember,_ts:String(Date.now())};
  food.logs.push(rec); DB.set('food',food);
  closeModal(); toast('已保存✅'); renderModule('food');
}
function delFoodLog(id){
  if(!confirm('确认删除？')) return;
  var food=DB.get('food',{blacklist:[],logs:[]});
  for(var i=0;i<food.logs.length;i++){
    if(food.logs[i].id===id){
      food.logs[i]._deletedAt=new Date().toISOString();
      food.logs[i]._ts=String(Date.now());
      break;
    }
  }
  DB.set('food',food);
  toast('已删除'); renderModule('food');
}

setStatus('辅食管理加载完成');

<script>

var HEALTH_ITEMS_DEFAULT=[
  {key:'water',icon:'💧',label:'饮水量',type:'value',unit:'ml',color:'mod-blue',custom:false},

  var custom = DB.get('healthCustom', []);

function getHealthItemLabel(key){
  var items = getHealthItems();
  for(var i=0; i<items.length; i++){
    if(items[i].key === key) return items[i];
  }
  return null;
}

function renderHealth(){
  var health=DB.get('health',{logs:[],reactions:[]}), today=todayStr();
  var items = getHealthItems();
  var todayLogs=health.logs.filter(function(l){return l.date===today && !l._deletedAt;});
  var todayWater=todayLogs.filter(function(l){return l.item==='water';}).reduce(function(s,l){return s+(+l.value||0);},0);

  var checkGrid=items.map(function(it){
    if(it.type==='value'){
      return '<div class="check-item '+it.color+'" onclick="quickHealthCheck(\''+it.key+'\',\''+it.label+'\')"><span class="ci-icon">'+it.icon+'</span><div class="ci-label">'+it.label+'</div><div class="ci-status">'+todayWater+'ml · 点击记录</div></div>';
    }
    var done=todayLogs.some(function(l){return l.item===it.key;});
    var delBtn = it.custom ? '<button class="ri-del" onclick="event.stopPropagation();delHealthCustom(\''+it.key+'\')" style="position:absolute;right:4px;top:4px;font-size:14px">×</button>' : '';
    return '<div class="check-item '+it.color+' '+(done?'done':'')+'" style="position:relative;'+(done?'':'opacity:0.6')+'" onclick="quickHealthCheck(\''+it.key+'\',\''+it.label+'\')"><span class="ci-icon">'+it.icon+'</span><div class="ci-label">'+it.label+'</div><div class="ci-status">'+(done?'✅已打卡':'未打卡')+'</div>'+delBtn+'</div>';
  }).join('');

  var visibleReactions = sortRecordsDesc((health.reactions||[]).filter(function(r){return !r._deletedAt;})).slice(0,10);
  var reactionHtml='';
  visibleReactions.forEach(function(r){
    reactionHtml+='<div class="record-item" style="cursor:pointer" onclick="showRecordDetail(\'反应详情\', '+JSON.stringify(r).replace(/'/g,"&#39;")+', \'health\')"><div class="ri-main"><div class="ri-content">⚠️ '+r.item+'</div><div class="ri-time">'+r.date+' '+r.time+' · '+notePreview(r.desc,20)+' · '+(r.member||'')+'</div></div><button class="ri-del" onclick="event.stopPropagation();delReaction(\''+r.id+'\')">×</button></div>';
  });
  if(!reactionHtml) reactionHtml='<div class="empty" style="padding:14px"><span class="icon">⚠️</span>暂无不良反应</div>';

  var allLogs = health.logs.filter(function(l){return !l._deletedAt;});
  var hFiltered = state.filterDate ? allLogs.filter(function(l){return l.date===state.filterDate;}) : sortRecordsDesc(allLogs).slice(0,30);

  hFiltered.forEach(function(l){
    var it = getHealthItemLabel(l.item);
    historyHtml+='<div class="record-item" style="cursor:pointer" onclick="showRecordDetail(\'打卡详情\', '+JSON.stringify(l).replace(/'/g,"&#39;")+', \'health\')"><span style="font-size:18px">'+(it?it.icon:'💊')+'</span><div class="ri-main"><div class="ri-content">'+(it?it.label:l.item)+' '+(l.value?l.value+'ml':'')+'</div><div class="ri-time">'+l.date+' '+l.time+' · '+(l.member||'')+'</div></div></div>';

<script>

/* 采购金额汇总 */
function getPurchaseSummary(){
  var memo = DB.get('memo', {purchase:[],notes:[]});
  var now = new Date();
  var monthStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  var yearStr = String(now.getFullYear());
  var monthTotal = 0, yearTotal = 0, allTotal = 0;
  memo.purchase.forEach(function(p){
    if(p._deletedAt) return;
    var amount = p.total || (p.price||0) * (p.quantity||1);
    allTotal += amount;
    if(p.date && p.date.indexOf(monthStr) === 0) monthTotal += amount;
    if(p.date && p.date.indexOf(yearStr) === 0) yearTotal += amount;
  });
  return { month: monthTotal, year: yearTotal, all: allTotal };
}

  var memo=DB.get('memo',{purchase:[],notes:[]});
  var visiblePurchase = memo.purchase.filter(function(p){return !p._deletedAt;});

  var purchaseDone = visiblePurchase.filter(function(p){return p.done;});

  var sortedPurchase = sortRecordsDesc(visiblePurchase.map(function(p){return p;}));

  var purchaseHtml='';

    var qtyStr = p.quantity > 1 ? ' x'+p.quantity : '';

<script>
/* ====================================================
   初始化
   ==================================================== */
/* ====================================================
   数据迁移（版本化升级，保留原有数据）
   ==================================================== */
function migrateData(){
  var CURRENT = 4;
  var v = DB.get('_dataVersion', 0);
  if(v >= CURRENT) return;

  /* v0→v1: 给所有记录添加时间戳_ts */
  if(v < 1){
    var keys1 = ['feeding','daily','nursing','growth','skills'];
    keys1.forEach(function(k){
      var data = DB.get(k, []);
      if(Array.isArray(data)){
        data.forEach(function(r){
          if(!r._ts && r.id) r._ts = String(r.id);
        });
        DB.set(k, data);
      }
    });
    /* health 有 logs 和 reactions */
    var health = DB.get('health', {logs:[],reactions:[]});
    if(health.logs){
      health.logs.forEach(function(r){ if(!r._ts && r.id) r._ts = String(r.id); });
    }
    if(health.reactions){
      health.reactions.forEach(function(r){ if(!r._ts && r.id) r._ts = String(r.id); });
    }
    DB.set('health', health);
    /* food 有 logs */
    var food = DB.get('food', {blacklist:[],logs:[]});
    if(food.logs){
      food.logs.forEach(function(r){ if(!r._ts && r.id) r._ts = String(r.id); });
    }
    DB.set('food', food);
    console.log('[Migrate] v0→v1: 添加时间戳完成');
  }

  /* v1→v2: 采购项添加id/price/quantity/total字段 */
  if(v < 2){
    var memo = DB.get('memo', {purchase:[],notes:[]});
    if(memo.purchase){
      memo.purchase.forEach(function(p){
        if(!p.id) p.id = String(Date.now()) + '_' + Math.random().toString(36).substr(2,5);
        if(p.price === undefined) p.price = 0;
        if(p.quantity === undefined) p.quantity = 1;
        if(p.total === undefined) p.total = (p.price||0) * (p.quantity||1);
      });
    }
    if(memo.notes){
      memo.notes.forEach(function(n){
        if(!n.id) n.id = String(Date.now()) + '_' + Math.random().toString(36).substr(2,5);
      });
    }
    DB.set('memo', memo);
    console.log('[Migrate] v1→v2: 采购项字段升级完成');
  }

  /* v2→v3: 初始化自定义项和疫苗排序 */
  if(v < 3){
    if(DB.get('nursingCustom', null) === null) DB.set('nursingCustom', []);
    if(DB.get('healthCustom', null) === null) DB.set('healthCustom', []);
    if(DB.get('vaccineOrder', null) === null){
      DB.set('vaccineOrder', VACCINE_LIST.map(function(vv){ return vv.name; }));
    }
    console.log('[Migrate] v2→v3: 初始化自定义项完成');
  }

  /* v3→v4: 早教数据结构升级（对象→数组）+ 初始化早教自定义项 */
  if(v < 4){
    /* 初始化早教自定义项 */
    if(DB.get('earlyeduCustom', null) === null) DB.set('earlyeduCustom', []);
    /* 将旧版earlyedu对象格式（{key:{done:true,date:...}}）转换为新版数组格式 */
    var oldEdu = DB.get('earlyedu', null);
    if(oldEdu && !Array.isArray(oldEdu)){
      var newEdu = [];
      for(var ek in oldEdu){
        if(oldEdu.hasOwnProperty(ek) && oldEdu[ek] && oldEdu[ek].done){
          newEdu.push({
            id: 'migrated_'+ek+'_'+Date.now(),
            item: ek,
            date: oldEdu[ek].date || todayStr(),
            time: '',
            note: '',
            member: oldEdu[ek].member || '',
            _ts: String(Date.now())
          });
        }
      }
      DB.set('earlyedu', newEdu);
      console.log('[Migrate] v3→v4: 早教数据迁移 ' + newEdu.length + ' 条记录');
    } else if(oldEdu === null){
      DB.set('earlyedu', []);
    }
    console.log('[Migrate] v3→v4: 早教模块升级完成');
  }

  DB.set('_dataVersion', CURRENT);
  console.log('[Migrate] 数据迁移完成, 版本: ' + CURRENT);
}

/* 检查应用版本，清理旧缓存 */
function checkAppVersion(){
  var saved = DB.get('appVersion', '');
  if(saved && saved !== APP_VERSION){
    if('caches' in window){
      caches.keys().then(function(names){
        names.forEach(function(name){
          if(name !== CACHE_VER) caches.delete(name);
        });
      });
    }
    console.log('[PWA] 版本更新: ' + saved + ' → ' + APP_VERSION);
  }
  DB.set('appVersion', APP_VERSION);
}

setStatus('所有模块就绪，启动中...');

function init(){
  try {
    setStatus('加载数据中...');
    
    /* 异步初始化数据（localStorage + IndexedDB恢复） */
    DB.init(function(){
      try {
        /* 数据迁移（保留原有数据，添加新字段） */
        migrateData();
        
        /* 检查应用版本，清理旧缓存 */
        checkAppVersion();
        
        /* PWA: 设置 manifest 和 Service Worker（离线缓存） */
        setupManifest();
        setupServiceWorker();
        
        /* 检测是否需要先从云端拉取（localStorage 为空 = 新设备/新域名） */
        var hasLocalData = countLocalData() > 0;
        
        if(hasLocalData){
          /* 本地有数据：直接渲染，云端同步在后台进行 */
          setStatus('加载完成');
          renderNav();
          refreshTopMeta();
          renderModule('home');
          setInterval(refreshTopMeta, 60000);
          setInterval(autoBackupReminder, 1800000);
          setTimeout(function(){ hideLoading(); }, 300);
          
          /* 启动云端同步 */
          CloudSync.init(function(){
            renderModule(state.currentModule);
            refreshTopMeta();
          });
        } else {
          /* 本地无数据（可能是新域名/清缓存）：先从云端拉取再渲染 */
          setStatus('正在从云端同步数据...');
          setTimeout(function(){ showToastTip('☁️ 正在拉取云端数据...', 3000); }, 100);
          
          CloudSync.init(function(){
            setStatus('加载完成');
            renderNav();
            refreshTopMeta();
            renderModule('home');
            setInterval(refreshTopMeta, 60000);
            setInterval(autoBackupReminder, 1800000);
            setTimeout(function(){ hideLoading(); }, 300);
            renderModule(state.currentModule);
            refreshTopMeta();
          });
        }
        
        /* 启动定时轮询同步（每60秒拉取云端最新数据） */
        startSyncPolling();
        
        /* 启动后检查备份提醒 */
        setTimeout(function(){
          var dataCount = countLocalData();
      if(dataCount > 0){
        var lastBackup = DB.get('lastBackupTime', null);
        var needRemind = false;
        if(!lastBackup){ needRemind = true; }
        else { var diff = Date.now() - new Date(lastBackup).getTime(); if(diff > 86400000) needRemind = true; }
        if(needRemind && !CloudSync.enabled){
          showToastTip('💡 建议开启云端同步或导出备份，防止数据丢失', 5000);
        }
      }
        }, 3000);
      } catch(e2) {
        setStatus('初始化错误: ' + e2.message);
        document.getElementById('loadStatus').style.color = 'red';
      }
    });
  } catch(e) {
    setStatus('初始化错误: ' + e.message);
    document.getElementById('loadStatus').style.color = 'red';
  }
}

/* 统计本地数据条数 */
function countLocalData(){
  var count = 0;
  var keys = ['feeding','daily','nursing','growth','vaccine','food','skills','health','memo','earlyedu'];
  for(var i=0; i<keys.length; i++){
    var data = DB.get(keys[i], []);
    if(Array.isArray(data)) count += data.length;
    else if(data && data.logs) count += data.logs.length;
  }
  return count;
}

/* 自动备份提醒 */
function autoBackupReminder(){
  var dataCount = countLocalData();
  if(dataCount === 0) return;
  var lastBackup = DB.get('lastBackupTime', null);
  if(!lastBackup) return;
  var diff = Date.now() - new Date(lastBackup).getTime();
  if(diff > 86400000){
    showToastTip('💡 已有' + dataCount + '条记录，记得导出备份哦', 4000);
  }
}

/* 更长时间的Toast提示 */
function showToastTip(msg, duration){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.style.whiteSpace = 'normal';
  t.style.lineHeight = '1.4';
  t.style.maxWidth = '90%';
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(function(){
    t.classList.remove('show');
    t.style.whiteSpace = '';
    t.style.lineHeight = '';
  }, duration || 3000);
}

/* 导出时记录备份时间 - 修改原有exportData */
var _originalExportData = exportData;
exportData = function(){
  _originalExportData();
  DB.set('lastBackupTime', new Date().toISOString());
};

/* ====================================================
   网络状态管理（非阻断式）
   ==================================================== */
var _isOnline = navigator.onLine !== false;

function updateNetworkStatus(){
  var wasOnline = _isOnline;
  _isOnline = navigator.onLine !== false;
  var banner = document.getElementById('netBanner');
  if(!banner) return;
  
  if(!_isOnline){
    /* 离线：显示底部横幅（非阻断） */
    banner.classList.add('show');
    var txt = document.getElementById('netBannerText');
    if(txt) txt.textContent = '网络已断开，当前查看本地数据';
    /* 暂停云端同步轮询，省电防错 */
    if(typeof _syncPollTimer !== 'undefined' && _syncPollTimer){
      clearInterval(_syncPollTimer);
      _syncPollTimer = null;
    }
  } else {
    /* 在线：隐藏横幅 */
    banner.classList.remove('show');
    /* 恢复云端同步轮询 */
    if(typeof startSyncPolling === 'function' && !_syncPollTimer){
      startSyncPolling();
    }
    /* 刚恢复在线：触发一次同步 */
    if(!wasOnline && typeof CloudSync !== 'undefined' && CloudSync.enabled){
      CloudSync.pull(function(ok){
        if(ok) renderModule(state.currentModule);
      });
    }
  }
}

function retryNetwork(){
  if(navigator.onLine){
    updateNetworkStatus();
    if(typeof CloudSync !== 'undefined' && CloudSync.enabled){
      CloudSync.manualSync(function(ok, msg){
        if(ok){
          showToastTip('☁️ 同步成功', 2000);
          renderModule(state.currentModule);
        } else {
          showToastTip('❌ ' + msg, 3000);
        }
      });
    } else {
      showToastTip('网络已恢复', 2000);
    }
  } else {
    showToastTip('仍处于离线状态', 2000);
  }
}

window.addEventListener('online', updateNetworkStatus);
window.addEventListener('offline', updateNetworkStatus);
setTimeout(updateNetworkStatus, 500);

/* ====================================================
   iOS PWA 生命周期处理
   ==================================================== */

/* 检测是否在PWA standalone模式 */
function isStandalonePWA(){
  return (window.navigator.standalone === true) ||
         (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}

/* 应用进入后台前持久化数据 */
function persistDataBeforeBackground(){
  try{
    /* 刷新IndexedDB保存队列 */
    if(typeof DB !== 'undefined' && DB._idbReady && DB._saveQueue.length > 0){
      DB._flushSaveQueue();
    }
    /* 取消防抖定时器，立即推送 */
    if(typeof CloudSync !== 'undefined' && CloudSync.debounceTimer){
      clearTimeout(CloudSync.debounceTimer);
      CloudSync.debounceTimer = null;
    }
    /* 云端推送未保存的数据（异步push） */
    if(typeof CloudSync !== 'undefined' && CloudSync.enabled && !CloudSync.syncing){
      CloudSync.push(function(){});
    }
  }catch(e){
    console.log('[PWA] persistDataBeforeBackground error: ' + e.message);
  }
}

/* 应用进入后台/恢复前台 */
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden'){
    /* 进入后台：持久化数据 */
    persistDataBeforeBackground();
  } else if(document.visibilityState === 'visible'){
    /* 恢复前台：延迟300ms刷新（等iOS解冻webview） */
    setTimeout(function(){
      updateNetworkStatus();
      if(typeof state !== 'undefined' && state.currentModule){
        renderModule(state.currentModule);
        refreshTopMeta();
      }
      if(navigator.onLine !== false && typeof CloudSync !== 'undefined' && CloudSync.enabled){
        CloudSync.pull(function(ok){
          if(ok) renderModule(state.currentModule);
        });
      }
    }, 300);
  }
});

/* 兼容旧版iOS的页面隐藏/恢复 */
window.addEventListener('pagehide', function(){
  /* 先做常规持久化（IndexedDB + 异步push） */
  persistDataBeforeBackground();
  /* 再做紧急推送：同步XHR，确保关闭页面前数据已上传云端 */
  if(typeof CloudSync !== 'undefined' && CloudSync.enabled){
    CloudSync.emergencyPush();
  }
});

/* beforeunload 兜底：部分Android浏览器只触发此事件 */
window.addEventListener('beforeunload', function(){
  if(typeof CloudSync !== 'undefined' && CloudSync.enabled){
    CloudSync.emergencyPush();
  }
});

window.addEventListener('pageshow', function(e){
  if(e.persisted){
    /* 从bfcache恢复 */
    setTimeout(function(){
      updateNetworkStatus();
      renderModule(state.currentModule);
      refreshTopMeta();
    }, 300);
  }
});

document.addEventListener('DOMContentLoaded', init);

document.addEventListener('touchstart',function(e){ if(e.touches.length>1) e.preventDefault(); },{passive:false});
var lastTouch=0;
document.addEventListener('touchend',function(e){ var now=Date.now(); if(now-lastTouch<300) e.preventDefault(); lastTouch=now; },{passive:false});
</script>
